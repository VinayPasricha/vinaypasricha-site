name: Book Growth Daily Accountability

on:
  push:
    branches:
      - agent/ai-course-staging
    paths:
      - '.github/workflows/book-growth-command.yml'
      - 'backend/src/growthCommand.js'
      - 'backend/src/server.js'
      - 'backend/src/config.js'
      - 'backend/src/firestore.js'
      - 'studio/analytics.html'
      - 'studio/book-growth-command.js'
      - 'studio/book-growth-command.css'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/book-growth-command.yml'
      - 'backend/src/growthCommand.js'
      - 'backend/src/server.js'
      - 'backend/src/config.js'
      - 'backend/src/firestore.js'
      - 'studio/analytics.html'
      - 'studio/book-growth-command.js'
      - 'studio/book-growth-command.css'
  workflow_dispatch:
    inputs:
      mode:
        description: Which notification cycle to run
        required: true
        default: assign
        type: choice
        options:
          - assign
          - followup
          - close
  schedule:
    # GitHub Actions schedules use UTC. These are 09:00, 16:00 and 19:00 IST.
    - cron: '30 3 * * *'
    - cron: '30 10 * * *'
    - cron: '30 13 * * *'

permissions:
  contents: read

concurrency:
  group: book-growth-${{ github.event_name }}-${{ github.ref }}-${{ github.event.schedule || inputs.mode || 'validate' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out proposed build
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Parse changed JavaScript
        run: |
          set -euo pipefail
          node --check backend/src/growthCommand.js
          node --check backend/src/server.js
          node --check backend/src/config.js
          node --check backend/src/firestore.js
          node --check studio/book-growth-command.js

      - name: Verify dashboard contracts
        run: |
          set -euo pipefail
          grep -q 'id="todayTasks"' studio/analytics.html
          grep -q 'id="proofDialog"' studio/analytics.html
          grep -q '/api/growth/command' studio/book-growth-command.js
          grep -q 'registerGrowthCommandRoutes' backend/src/server.js
          grep -q '/api/growth/cron/:mode' backend/src/growthCommand.js

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run backend tests
        working-directory: backend
        run: npm test

  deliver:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Choose notification cycle
        id: cycle
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            mode="$MANUAL_MODE"
          elif [[ "$SCHEDULE" == "30 3 * * *" ]]; then
            mode="assign"
          elif [[ "$SCHEDULE" == "30 10 * * *" ]]; then
            mode="followup"
          else
            mode="close"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Send daily tasks or follow-up
        shell: bash
        env:
          BASE_URL: ${{ secrets.GROWTH_COMMAND_BASE_URL }}
          CRON_SECRET: ${{ secrets.GROWTH_CRON_SECRET }}
          MODE: ${{ steps.cycle.outputs.mode }}
        run: |
          set -euo pipefail
          if [[ -z "$BASE_URL" || -z "$CRON_SECRET" ]]; then
            echo "GROWTH_COMMAND_BASE_URL and GROWTH_CRON_SECRET must be configured as repository secrets." >&2
            exit 1
          fi
          base="${BASE_URL%/}"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 \
            -X POST "$base/api/growth/cron/$MODE" \
            -H "Content-Type: application/json" \
            -H "x-growth-cron-secret: $CRON_SECRET" \
            -d '{}'
