name: Translate

# Auto-translate every language pack against the current site.
#
# Runs:
#   - on push to main, but only when content (HTML) changes
#   - on a weekly schedule (catches any drift)
#   - on manual dispatch
#
# Translation runs on Google Cloud (Gemini via Vertex AI), reached through the
# live site's own public AI endpoint — so no API key / secret is required.
# Override the endpoint with the AI_ENDPOINT repo variable if the URL changes.

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'paths/**.html'
      - 'signal/**.html'
      - 'scripts/translate-pack.mjs'
      - 'package.json'
  schedule:
    - cron: '0 4 * * 0'   # weekly, Sunday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    # Skip if the head commit was made BY this workflow (avoids loops)
    if: "!contains(github.event.head_commit.message, 'Auto-translate')"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run translation
        env:
          # Google Cloud Gemini via the site's public AI endpoint (no key needed).
          # Set the AI_ENDPOINT repo variable to override the default URL.
          AI_ENDPOINT: ${{ vars.AI_ENDPOINT }}
          # Lets the bulk run bypass the endpoint's per-IP rate limit.
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: node scripts/translate-pack.mjs

      - name: Commit updated packs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain assets/data/i18n/)" ]; then
            git add assets/data/i18n/*.json
            git commit -m "Auto-translate: refresh language packs"
            git push
          else
            echo "No translation changes — packs already up to date."
          fi
