name: AI Course Launch Audit

# Manual only. Automatic push and pull-request triggers were removed to prevent
# repeated failure notifications while staging infrastructure is being isolated.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-course-launch-audit
  cancel-in-progress: true

jobs:
  launch-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out audited commit
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check five-session course structure
        run: npm run test:abl-course
      - name: Install the backend dependencies used by the container
        run: npm --prefix backend install --omit=dev
      - name: Validate container Studio hardening transformation
        run: node scripts/harden-studio-gate.mjs
      - name: Check patched server syntax
        run: node --check backend/src/app.js && node --check backend/src/server.js
      - name: Start container-equivalent server and test Studio gate
        run: npm run test:abl-server-start
      - name: Check launch-critical participant and Studio paths
        run: npm run test:abl-launch

  deployed-staging-smoke:
    needs: launch-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ABL_STAGING_BASE_URL: https://vinay-site-staging-349140108061.asia-south1.run.app
      ABL_EXPECTED_RELEASE: abl-course-staging-20260730-0133
      ABL_DEPLOY_WAIT_SECONDS: '720'
    steps:
      - name: Check out audited commit
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Wait for exact Cloud Run revision and test live security routes
        run: npm run test:abl-staging
      - name: Install browser driver only
        run: npm install --no-save --ignore-scripts playwright-core@1.54.1
      - name: Test participant workspace on mobile and desktop Chrome
        run: npm run test:abl-staging-browser
      - name: Upload staging screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abl-staging-browser-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
