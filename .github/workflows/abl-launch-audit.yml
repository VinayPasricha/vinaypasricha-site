name: AI Course Launch Audit

# Manual only. Automatic push and pull-request triggers were deliberately removed
# to prevent repeated failure notifications while staging infrastructure is being
# isolated. Run this workflow only when a deliberate launch audit is required.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-course-launch-audit
  cancel-in-progress: true

jobs:
  deployment-capability:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      HAS_GCP_SA_KEY: ${{ secrets.GCP_SA_KEY != '' }}
      HAS_GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS != '' }}
      HAS_GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS != '' }}
      HAS_GOOGLE_CLOUD_CREDENTIALS: ${{ secrets.GOOGLE_CLOUD_CREDENTIALS != '' }}
      HAS_WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
      HAS_WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT != '' }}
      HAS_ALT_WIF_PROVIDER: ${{ secrets.WIF_PROVIDER != '' }}
      HAS_ALT_WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT != '' }}
      HAS_PROJECT_SECRET: ${{ secrets.GCP_PROJECT_ID != '' }}
      HAS_PROJECT_VAR: ${{ vars.GCP_PROJECT_ID != '' }}
      HAS_GOOGLE_PROJECT_VAR: ${{ vars.GOOGLE_CLOUD_PROJECT != '' }}
    steps:
      - name: Report deployment credential availability without exposing secrets
        run: |
          printf 'GCP_SA_KEY=%s\n' "$HAS_GCP_SA_KEY"
          printf 'GCP_CREDENTIALS=%s\n' "$HAS_GCP_CREDENTIALS"
          printf 'GOOGLE_CREDENTIALS=%s\n' "$HAS_GOOGLE_CREDENTIALS"
          printf 'GOOGLE_CLOUD_CREDENTIALS=%s\n' "$HAS_GOOGLE_CLOUD_CREDENTIALS"
          printf 'GCP_WORKLOAD_IDENTITY_PROVIDER=%s\n' "$HAS_WIF_PROVIDER"
          printf 'GCP_SERVICE_ACCOUNT=%s\n' "$HAS_WIF_SERVICE_ACCOUNT"
          printf 'WIF_PROVIDER=%s\n' "$HAS_ALT_WIF_PROVIDER"
          printf 'WIF_SERVICE_ACCOUNT=%s\n' "$HAS_ALT_WIF_SERVICE_ACCOUNT"
          printf 'GCP_PROJECT_ID_SECRET=%s\n' "$HAS_PROJECT_SECRET"
          printf 'GCP_PROJECT_ID_VAR=%s\n' "$HAS_PROJECT_VAR"
          printf 'GOOGLE_CLOUD_PROJECT_VAR=%s\n' "$HAS_GOOGLE_PROJECT_VAR"

  launch-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out audited commit
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check five-session course structure
        run: npm run test:abl-course
      - name: Install the backend dependencies used by the container
        run: npm --prefix backend install --omit=dev
      - name: Validate container Studio hardening transformation
        run: node scripts/harden-studio-gate.mjs
      - name: Check patched server syntax
        run: node --check backend/src/app.js && node --check backend/src/server.js
      - name: Start container-equivalent server and test Studio gate
        run: npm run test:abl-server-start
      - name: Check launch-critical participant and Studio paths
        run: npm run test:abl-launch

  deployed-staging-smoke:
    needs: launch-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ABL_STAGING_BASE_URL: https://vinay-site-staging-349140108061.asia-south1.run.app
      ABL_EXPECTED_RELEASE: abl-course-staging-20260730-0220
      ABL_DEPLOY_WAIT_SECONDS: '720'
    steps:
      - name: Check out audited commit
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Wait for one stable Cloud Run revision and test live security routes
        run: npm run test:abl-staging
      - name: Install browser driver only
        run: npm install --no-save --ignore-scripts playwright-core@1.54.1
      - name: Test participant workspace on mobile and desktop Chrome
        run: npm run test:abl-staging-browser
      - name: Upload staging screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abl-staging-browser-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
