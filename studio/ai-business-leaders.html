<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI for Business Leaders — Studio · Vinay Pasricha</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/site.css">
  <link rel="stylesheet" href="studio.css">
  <style>
    .abl-wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }
    .abl-sec { margin: 26px 0; }
    .abl-sec h2 { font-family: var(--mono); font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-2); border-bottom: 1px solid var(--rule); padding-bottom: 10px; margin-bottom: 16px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    label.fld { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin: 8px 0 3px; }
    input.ipt, textarea.ipt, select.ipt { width: 100%; border: 1px solid var(--rule); background: var(--paper-3); border-radius: 4px; padding: 9px 11px; font: inherit; font-size: 14px; color: var(--ink); }
    input.ipt:focus, textarea.ipt:focus { outline: none; border-color: var(--accent); }
    textarea.ipt { resize: vertical; line-height: 1.5; }
    textarea.ipt.auto { resize: none; overflow: hidden; }
    .btn { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; background: var(--ink); color: var(--paper); border: none; border-radius: 5px; padding: 9px 16px; cursor: pointer; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn.accent { background: var(--accent); }
    .btn.ghost { background: none; color: var(--accent); border: 1px solid var(--rule); }
    .tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
    .tbl th { font-family: var(--mono); font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--rule); }
    .tbl th.sortable { cursor: pointer; user-select: none; }
    .tbl th.sortable:hover { color: var(--accent); }
    .tbl th.sortable .arrow { opacity: .55; margin-left: 3px; }
    .tbl th.sorted { color: var(--accent); }
    .tbl td { padding: 11px 10px; border-bottom: 1px solid var(--rule-soft); vertical-align: top; }
    .tbl tr:hover td { background: var(--paper-3); cursor: pointer; }
    .tbl .nm { font-family: var(--serif); font-size: 15px; }
    .tbl .sub { font-family: var(--mono); font-size: 10px; color: var(--ink-3); }
    .pill { font-family: var(--mono); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; background: var(--paper-2); color: var(--ink-2); padding: 3px 8px; border-radius: 2px; white-space: nowrap; }
    .pill.on { background: var(--accent); color: var(--paper); }
    .detail { border: 1px solid var(--rule); border-radius: 6px; background: var(--paper-3); padding: 20px; margin-top: 14px; }
    .detail h3 { font-family: var(--serif); font-size: 20px; }
    .detail .card { border: 1px solid var(--rule); border-radius: 5px; padding: 16px; background: var(--paper); margin-top: 14px; }
    .detail .card h4 { font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 10px; }
    .qa-list { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 18px; }
    .qa-list label { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--ink-2); padding: 3px 0; cursor: pointer; }
    .qa-list input { margin-top: 3px; accent-color: var(--accent); }
    .qa-chat { border: 1px solid var(--rule); border-radius: 5px; background: var(--paper-3); padding: 10px; max-height: 260px; overflow: auto; display: flex; flex-direction: column; gap: 8px; }
    .qa-b { font-size: 13.5px; line-height: 1.5; padding: 8px 11px; border-radius: 8px; max-width: 88%; }
    .qa-b.me { align-self: flex-end; background: var(--ink); color: var(--paper); }
    .qa-b.them { align-self: flex-start; background: var(--paper); border: 1px solid var(--rule); }
    .row-actions a { font-family: var(--mono); font-size: 11px; color: var(--accent); margin-right: 10px; text-decoration: none; }
    .muted { color: var(--ink-3); font-style: italic; }
    .del { background: none; border: none; color: var(--ink-4); font-size: 15px; cursor: pointer; padding: 2px 6px; border-radius: 3px; line-height: 1; }
    .del:hover { color: var(--accent); background: var(--paper-2); }
    .btn.danger { background: none; color: var(--accent); border: 1px solid var(--accent); }
    .btn.danger:hover { background: var(--accent); color: var(--paper); }
    .stats { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
    .stat { background: var(--paper-3); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 16px; min-width: 96px; }
    .stat.hot { border-color: var(--accent); background: var(--paper-2); }
    .stat-v { font-family: var(--serif); font-size: 22px; color: var(--ink); }
    .stat-l { font-family: var(--mono); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-top: 2px; }
    .newpill { font-family: var(--mono); font-size: 8.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); border-radius: 3px; padding: 1px 5px; vertical-align: middle; }
    tr.new-row td { background: color-mix(in srgb, var(--accent) 5%, var(--paper-3)); }
    .fbline { font-size: 13px; color: var(--ink-2); margin-top: 8px; background: var(--paper-2); border-radius: 5px; padding: 8px 12px; }
    .fbline strong { color: var(--accent-2); }
    .viewbrief { font-family: var(--mono); font-size: 10px; letter-spacing: .06em; color: var(--accent); background: none; border: 1px solid var(--rule); border-radius: 3px; padding: 4px 8px; cursor: pointer; }
    .viewbrief:hover { border-color: var(--accent); }
    .brief-row td { background: var(--paper-3); }
    .brief-inline { padding: 8px 6px 14px; max-width: 820px; }
    .brief-inline :is(h1,h2,h3) { font-family: var(--serif); }
    .brief-inline h1 { font-size: 20px; margin: 6px 0; } .brief-inline h2 { font-size: 16px; margin: 14px 0 4px; border-bottom: 1px solid var(--rule); padding-bottom: 3px; } .brief-inline h3 { font-size: 14px; margin: 10px 0 3px; }
    .brief-inline p { margin: 6px 0; line-height: 1.55; font-size: 14px; } .brief-inline ul { margin: 6px 0 6px 18px; } .brief-inline li { margin: 2px 0; font-size: 14px; }
    .linkbox { font-family: var(--mono); font-size: 12px; background: var(--paper-2); padding: 8px 10px; border-radius: 4px; word-break: break-all; }
    .note-row { padding: 12px 0; border-top: 1px solid var(--rule-soft); }
    .note-row:first-child { border-top: 0; }
    .note-meta { font-family: var(--mono); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
    .note-copy { margin-top: 6px; white-space: pre-wrap; font-size: 13px; line-height: 1.55; color: var(--ink-2); }
    .transcript-box { border: 1px dashed var(--rule); border-radius: 5px; padding: 12px; margin-top: 12px; background: var(--paper-3); }
    .transcript-actions { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 10px; }
    .transcript-original { margin-top: 10px; }
    .transcript-original summary { cursor: pointer; font-family: var(--mono); font-size: 10px; color: var(--accent); }
    .transcript-original pre { white-space: pre-wrap; max-height: 280px; overflow: auto; padding: 10px; background: var(--paper-3); border: 1px solid var(--rule-soft); font: 12px/1.5 var(--mono); }
    .note-edit-box { margin-top: 8px; min-height: 220px; }
    .context-pending { border-style: dashed; background: var(--paper-3); }
    .asset-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; padding: 14px 0; border-top: 1px solid var(--rule-soft); }
    .asset-row:first-child { border-top: 0; }
    .asset-main { min-width: 0; }
    .asset-description { margin-top: 6px; font-size: 13px; line-height: 1.5; color: var(--ink-2); }
    .asset-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; flex: 0 0 auto; }
    .asset-actions .btn { padding: 7px 10px; font-size: 10px; }
    .participant-name { color: var(--ink); text-decoration: none; border-bottom: 1px solid transparent; }
    .participant-name:hover { color: var(--accent); border-bottom-color: var(--accent); }
    .dossier-back { display: inline-flex; align-items: center; gap: 7px; margin: 8px 0 18px; color: var(--accent); text-decoration: none; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; }
    .snapshot-card { border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--rule)); background: linear-gradient(145deg, var(--paper), var(--paper-2)); }
    .snapshot-head { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
    .snapshot-kicker { font-family:var(--mono); font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); margin-bottom:5px; }
    .snapshot-content { margin-top: 14px; columns: 2; column-gap: 34px; column-rule: 1px solid var(--rule-soft); }
    .snapshot-content :is(h1,h2,h3) { break-after:avoid; font-family:var(--serif); }
    .snapshot-content h1 { font-size:21px; } .snapshot-content h2 { font-size:16px; margin:14px 0 5px; } .snapshot-content h3 { font-size:14px; }
    .snapshot-content p, .snapshot-content li { font-size:13.5px; line-height:1.55; }
    .snapshot-content p { margin:5px 0; } .snapshot-content ul { margin:5px 0 8px 18px; }
    .evidence-strip { display:flex; flex-wrap:wrap; gap:7px; margin-top:12px; }
    .evidence-chip { font-family:var(--mono); font-size:9px; letter-spacing:.05em; border:1px solid var(--rule); background:var(--paper-3); padding:5px 8px; border-radius:999px; color:var(--ink-2); }
    .dossier-section { margin-top:12px; border:1px solid var(--rule-soft); border-radius:5px; background:var(--paper-3); }
    .dossier-section > summary { cursor:pointer; list-style:none; padding:12px 14px; display:flex; justify-content:space-between; gap:12px; font-family:var(--mono); font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-2); }
    .dossier-section > summary::-webkit-details-marker { display:none; }
    .dossier-section > summary::after { content:'＋'; color:var(--accent); }
    .dossier-section[open] > summary::after { content:'−'; }
    .dossier-body { border-top:1px solid var(--rule-soft); padding:12px 14px; }
    .conversation { padding:12px 0; border-top:1px solid var(--rule-soft); }
    .conversation:first-child { border-top:0; }
    .message { margin:8px 0; padding:8px 10px; border-radius:6px; font-size:13px; line-height:1.5; white-space:pre-wrap; }
    .message.user, .message.admin { background:var(--paper-2); margin-left:8%; }
    .message.assistant { background:var(--paper); border:1px solid var(--rule-soft); margin-right:8%; }
    .message-role { display:block; font-family:var(--mono); font-size:8px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); margin-bottom:3px; }
    .memory-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
    .memory-item { border:1px solid var(--rule-soft); background:var(--paper); padding:10px; border-radius:4px; }
    .memory-item strong { display:block; font-family:var(--mono); font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin-bottom:4px; }
    @media (max-width: 720px) {
      .grid2, .grid3 { grid-template-columns: 1fr; }
      .asset-row { flex-direction: column; }
      .asset-actions { justify-content: flex-start; }
      .snapshot-content { columns: 1; }
      .snapshot-head { flex-direction:column; }
      .memory-grid { grid-template-columns:1fr; }
    }
    #login { max-width: 360px; margin: 80px auto; text-align: center; }
    #login input { width: 100%; margin: 10px 0; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 4px; font-family: var(--mono); font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.show { opacity: 1; }
  </style>

  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/brand/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/brand/apple-touch-icon.png">
  <meta property="og:image" content="https://vinaypasricha.com/assets/images/brand/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

<body class="studio-body">
  <header class="studio-topbar">
    <div class="st-brand"><span class="st-mark">◯</span><span class="st-name">Studio</span><span class="st-sub">— AI for Business Leaders</span></div>
    <div class="st-right"><a class="st-link" href="index.html">← Studio</a></div>
  </header>

  <div id="login" style="display:none">
    <h2 style="font-family:var(--serif);font-size:22px">Studio access</h2>
    <input class="ipt" type="password" id="pw" placeholder="Passphrase">
    <button class="btn" id="loginBtn">Enter →</button>
    <p id="loginErr" class="muted" style="display:none;margin-top:8px">That wasn't it.</p>
  </div>

  <main class="abl-wrap" id="main" style="display:none">
    <div id="listView">
    <div class="abl-sec">
      <h2>New participant</h2>
      <div class="grid2">
        <div><label class="fld">Name *</label><input class="ipt" id="n-name" placeholder="Rajesh Menon"></div>
        <div><label class="fld">Company *</label><input class="ipt" id="n-company" placeholder="Meridian Logistics"></div>
      </div>
      <div class="grid3" style="margin-top:8px">
        <div><label class="fld">Role / title</label><input class="ipt" id="n-role" placeholder="Managing Director"></div>
        <div><label class="fld">Email</label><input class="ipt" id="n-email" placeholder="name@company.com"></div>
        <div><label class="fld">Website / domain</label><input class="ipt" id="n-website" placeholder="company.com"></div>
      </div>
      <div class="grid3" style="margin-top:8px">
        <div><label class="fld">Industry</label><input class="ipt" id="n-industry" placeholder="Logistics"></div>
        <div></div><div></div>
      </div>
      <label class="fld" style="margin-top:12px"><input type="checkbox" id="n-auto" checked style="accent-color:var(--accent)"> Auto-research the company on create (web-grounded)</label>
      <button class="btn accent" id="createBtn" style="margin-top:10px">+ Create participant</button>
    </div>

    <div class="abl-sec">
      <h2>Preload course participants</h2>
      <p class="muted">Paste one participant per line. Email alone works; for richer onboarding use: <strong>Name, Email, Company, Role</strong>.</p>
      <textarea class="ipt" id="bulkParticipants" rows="7" placeholder="anjali@company.com&#10;Rajesh Menon, rajesh@meridian.com, Meridian Logistics, Managing Director" style="width:100%;margin-top:10px;resize:vertical"></textarea>
      <div style="display:flex;align-items:center;gap:14px;margin-top:10px;flex-wrap:wrap">
        <button class="btn accent" id="bulkCreateBtn">Preload participants</button>
        <span class="muted" id="bulkStatus"></span>
      </div>
    </div>

    <div class="abl-sec">
      <h2>Participants <span id="pcount" class="sub" style="font-family:var(--mono);color:var(--ink-3)"></span></h2>
      <div class="stats" id="stats"></div>
      <table class="tbl"><thead><tr>
        <th>#</th>
        <th class="sortable" data-sort="name">Name</th>
        <th class="sortable" data-sort="company_name">Company</th>
        <th class="sortable" data-sort="status">Status</th>
        <th class="sortable" data-sort="created_at">Date</th>
        <th>Link</th>
        <th class="sortable" data-sort="message_count">Msgs</th>
        <th>Brief</th><th></th>
      </tr></thead><tbody id="rows"></tbody></table>
    </div>
    </div>

    <div id="detail"></div>
  </main>

  <div class="toast" id="toast"></div>
  <script src="ai-business-leaders.js"></script>
</body>
</html>
