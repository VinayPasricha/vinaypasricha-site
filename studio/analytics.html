<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics — Studio · Vinay Pasricha</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/site.css">
  <link rel="stylesheet" href="studio.css">
  <style>
    .an-wrap { max-width: 1160px; margin: 0 auto; padding: 24px; }
    .an-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 12px; margin-bottom: 6px; }
    .an-head h1 { font-family: var(--serif); font-size: 26px; }
    .an-range { display: flex; gap: 6px; }
    .an-range button { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; background: none; color: var(--ink-2); border: 1px solid var(--rule); border-radius: 5px; padding: 6px 12px; cursor: pointer; }
    .an-range button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .an-sub { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-bottom: 18px; }
    .an-note { font-size: 12px; color: var(--accent); background: var(--paper-2); border: 1px solid var(--rule); border-radius: 5px; padding: 8px 12px; margin: 8px 0 16px; }
    .an-sec { margin: 26px 0; }
    .an-sec h2 { font-family: var(--mono); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-2); border-bottom: 1px solid var(--rule); padding-bottom: 9px; margin-bottom: 16px; }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
    .stat { background: var(--paper-3); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; }
    .stat.hot { border-color: var(--accent); }
    .stat-v { font-family: var(--serif); font-size: 28px; color: var(--ink); line-height: 1.1; }
    .stat-l { font-family: var(--mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin-top: 5px; }
    .stat-s { font-family: var(--mono); font-size: 10px; color: var(--ink-4); margin-top: 2px; }

    .chart { background: var(--paper-3); border: 1px solid var(--rule); border-radius: 8px; padding: 16px; }
    .chart svg { width: 100%; height: 240px; display: block; }
    .chart .lgnd { display: flex; gap: 16px; margin-top: 8px; font-family: var(--mono); font-size: 10px; color: var(--ink-3); }
    .chart .lgnd .k { display: inline-flex; align-items: center; gap: 6px; }
    .chart .lgnd .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }

    .bars { display: flex; flex-direction: column; gap: 7px; }
    .bar { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
    .bar .lbl { position: relative; font-size: 13px; color: var(--ink); padding: 6px 10px; border-radius: 4px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .bar .fill { position: absolute; inset: 0; background: color-mix(in srgb, var(--accent) 16%, transparent); border-radius: 4px; z-index: 0; }
    .bar .lbl span { position: relative; z-index: 1; }
    .bar .val { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
    .muted { color: var(--ink-3); font-style: italic; font-size: 13px; }

    .mini { width: 100%; border-collapse: collapse; font-size: 13px; }
    .mini td { padding: 7px 8px; border-bottom: 1px solid var(--rule-soft); }
    .mini td.r { text-align: right; font-family: var(--mono); font-size: 11px; color: var(--ink-3); }

    #login { max-width: 360px; margin: 90px auto; text-align: center; }
    #login input { width: 100%; margin: 10px 0; border: 1px solid var(--rule); background: var(--paper-3); border-radius: 4px; padding: 9px 11px; font: inherit; }
    .btn { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; background: var(--ink); color: var(--paper); border: none; border-radius: 5px; padding: 9px 16px; cursor: pointer; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 4px; font-family: var(--mono); font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body class="studio-body">
  <header class="studio-topbar">
    <div class="st-brand"><span class="st-mark">◯</span><span class="st-name">Studio</span><span class="st-sub">— Analytics</span></div>
    <div class="st-right"><a class="st-link" href="index.html">← Studio</a></div>
  </header>

  <div id="login" style="display:none">
    <h2 style="font-family:var(--serif);font-size:22px">Studio access</h2>
    <input class="ipt" type="password" id="pw" placeholder="Passphrase">
    <button class="btn" id="loginBtn">Enter →</button>
    <p id="loginErr" class="muted" style="display:none;margin-top:8px">That wasn't it.</p>
  </div>

  <main class="an-wrap" id="main" style="display:none">
    <div class="an-head">
      <div>
        <h1>Website analytics</h1>
        <div class="an-sub" id="rangeSub">—</div>
      </div>
      <div class="an-range" id="range">
        <button data-days="7">7d</button>
        <button data-days="30" class="on">30d</button>
        <button data-days="90">90d</button>
        <button data-days="365">1y</button>
      </div>
    </div>

    <div id="note"></div>

    <div class="an-sec">
      <div class="stats" id="kpis"></div>
    </div>

    <div class="an-sec">
      <h2>Traffic over time</h2>
      <div class="chart" id="chart"></div>
    </div>

    <div class="an-sec">
      <h2>Where they go &amp; where they come from</h2>
      <div class="cols">
        <div><h3 style="font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px">Top pages</h3><div class="bars" id="topPages"></div></div>
        <div><h3 style="font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px">Top referrers</h3><div class="bars" id="topRefs"></div></div>
      </div>
    </div>

    <div class="an-sec">
      <div class="cols">
        <div><h3 style="font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px">Devices</h3><div class="bars" id="devices"></div></div>
        <div><h3 style="font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px">Languages</h3><div class="bars" id="langs"></div></div>
      </div>
    </div>

    <div class="an-sec">
      <h2>Engagement (AI runtimes &amp; leads)</h2>
      <div class="cols">
        <div><h3 style="font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px">AI conversations by runtime</h3><div class="bars" id="runtimes"></div></div>
        <div><h3 style="font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px">Recent leads</h3><table class="mini" id="leads"></table></div>
      </div>
    </div>

    <div class="an-sec">
      <h2>AI for Business Leaders — funnel</h2>
      <div class="bars" id="funnel"></div>
    </div>
  </main>

  <div class="toast" id="toast"></div>
  <script src="analytics-admin.js"></script>
</body>
</html>
