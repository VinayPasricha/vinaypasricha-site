<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Access — Vinay Pasricha</title>
  <meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,400&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0a0b0e; --gr-2:#0f1115; --ink:#ebe9e2; --ink-2:#b8b5ad; --ink-3:#6e6c66; --ink-4:#44433f;
      --freq:#6f9bb5; --freq-3:#2c4150; --rule-edge:#1c2030; --warn:#e0556b;
      --serif:'Newsreader',Georgia,serif; --sans:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
    }
    *{box-sizing:border-box;}
    body{
      margin:0; min-height:100vh; background:
        radial-gradient(1200px 600px at 50% -10%, #11161d 0%, transparent 60%), var(--bg);
      color:var(--ink); font-family:var(--serif);
      display:flex; align-items:center; justify-content:center; padding:24px;
    }
    .card{
      width:100%; max-width:420px; border:1px solid var(--rule-edge); border-radius:12px;
      background:linear-gradient(180deg,#10141a,#0c0e13); padding:38px 34px 32px;
      box-shadow:0 24px 80px rgba(0,0,0,.5);
    }
    .eyebrow{font-family:var(--mono); font-size:10px; letter-spacing:.24em; text-transform:uppercase; color:var(--freq); margin-bottom:16px;}
    .eyebrow .dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--freq); margin-right:8px; vertical-align:middle;}
    h1{font-size:30px; font-weight:300; letter-spacing:-.02em; margin:0 0 8px;}
    .sub{font-family:var(--sans); font-size:13px; font-weight:300; line-height:1.6; color:var(--ink-3); margin:0 0 26px;}
    label{display:block; font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3); margin-bottom:8px;}
    input{
      width:100%; background:#15181e; border:1px solid var(--rule-edge); border-radius:8px;
      padding:13px 14px; color:var(--ink); font-size:15px; font-family:var(--sans); outline:none; transition:border-color .15s;
    }
    input:focus{border-color:var(--freq);}
    input.bad{border-color:var(--warn);}
    button{
      width:100%; margin-top:18px; background:var(--freq); color:#08131c; border:0; border-radius:8px;
      padding:13px; font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; cursor:pointer; transition:opacity .15s;
    }
    button:hover{opacity:.9;} button:disabled{opacity:.5; cursor:default;}
    .err{font-family:var(--sans); font-size:12.5px; color:var(--warn); margin-top:12px; min-height:16px;}
    .note{font-family:var(--mono); font-size:10px; letter-spacing:.06em; color:var(--ink-4); margin-top:22px; line-height:1.6;}
    .note a{color:var(--ink-3);}
  </style>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/brand/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/brand/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta property="og:image" content="https://vinaypasricha.com/assets/images/brand/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:image" content="https://vinaypasricha.com/assets/images/brand/og-image.png">
</head>
<body>
  <div class="card" role="dialog" aria-label="Studio access">
    <div class="eyebrow"><span class="dot"></span>Studio · Operator access</div>
    <h1>The Studio</h1>
    <p class="sub">The operator backend for the Organizational Frequency runtime. Admin only — enter your access key to continue.</p>

    <label for="pw">Access key</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••••" autofocus>
    <button id="go" type="button">Enter Studio →</button>
    <div class="err" id="err"></div>

    <div class="note">Access is logged. This page is noindex. · <a href="../">Back to site</a></div>
  </div>

  <script>
    (function () {
      var pw = document.getElementById('pw');
      var go = document.getElementById('go');
      var err = document.getElementById('err');

      function submit() {
        var val = pw.value.trim();
        pw.classList.remove('bad'); err.textContent = '';
        if (!val) { pw.classList.add('bad'); err.textContent = 'Enter the access key.'; pw.focus(); return; }
        go.disabled = true; go.textContent = 'Checking…';
        fetch('/api/studio/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: val })
        }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (res) {
            if (res.ok && res.d && res.d.ok) {
              go.textContent = 'Entering…';
              var next = new URLSearchParams(location.search).get('next');
              location.href = (next && next.indexOf('/studio') === 0) ? next : '/studio/';
            } else {
              go.disabled = false; go.textContent = 'Enter Studio →';
              pw.classList.add('bad');
              err.textContent = (res.d && res.d.error === 'admin_disabled')
                ? 'Admin access is not configured on the server.'
                : 'Incorrect access key.';
              pw.select();
            }
          }).catch(function () {
            go.disabled = false; go.textContent = 'Enter Studio →';
            err.textContent = 'Network error. Try again.';
          });
      }

      go.addEventListener('click', submit);
      pw.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
    })();
  </script>
</body>
</html>
