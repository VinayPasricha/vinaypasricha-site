<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Leadership Workspace — Staging Preview</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--paper:#f5f0e6;--paper2:#fbf8f1;--deep:#ebe3d5;--ink:#1d1a17;--muted:#756e64;--faint:#9c9488;--rule:rgba(48,42,35,.16);--red:#b4472d;--sage:#647363;--gold:#9a7541;--serif:Georgia,serif;--mono:"Courier New",monospace}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}.top{height:70px;border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;background:rgba(245,240,230,.96);z-index:20}.brand{font:21px var(--serif)}.brand em{color:var(--red);font-style:normal}.brand small{margin-left:16px;color:var(--muted);font:9px var(--mono);letter-spacing:.12em;text-transform:uppercase}.switch{display:flex;gap:8px}.switch button,.btn{border:1px solid var(--rule);background:transparent;border-radius:5px;padding:10px 13px;font:10px var(--mono);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.switch button.on,.btn.dark{background:var(--ink);color:var(--paper)}.btn.red{background:var(--red);color:#fff;border-color:var(--red)}.layout{display:grid;grid-template-columns:265px minmax(0,1fr);min-height:calc(100vh - 70px)}aside{border-right:1px solid var(--rule);padding:18px 14px;background:rgba(251,248,241,.5)}.ws{padding:12px 10px 18px;border-bottom:1px solid var(--rule)}.ws small,.label,.eyebrow{font:9px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--red)}.ws h2{font:23px/1.05 var(--serif);margin:8px 0 4px}.ws p{color:var(--muted);font-size:12px}.group{margin-top:18px}.group .label{color:var(--faint);padding:0 10px 7px}.nav{width:100%;border:0;background:transparent;text-align:left;padding:10px;border-radius:6px;color:#49423b;cursor:pointer}.nav:hover{background:rgba(255,255,255,.55)}.nav.on{background:var(--paper2);box-shadow:inset 3px 0 0 var(--red)}main{padding:36px 40px 90px;max-width:1200px;width:100%;margin:0 auto}.eyebrow{margin:0 0 10px}h1{font:48px/.98 var(--serif);letter-spacing:-.03em;margin:0 0 14px}h2{font:30px/1.1 var(--serif);margin:0 0 10px}h3{font:21px/1.15 var(--serif);margin:0 0 8px}.lede{font:18px/1.5 var(--serif);color:#454039;max-width:780px}.panel,.card{border:1px solid var(--rule);background:rgba(251,248,241,.68);border-radius:8px;padding:22px}.hero{display:grid;grid-template-columns:1.4fr .6fr;gap:34px;align-items:end}.id{border-left:1px solid var(--rule);padding-left:22px}.id strong{display:block;font:23px var(--serif);margin:8px 0}.id span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.next{margin-top:27px;display:grid;grid-template-columns:7px 1fr auto;gap:18px;align-items:center;background:linear-gradient(120deg,var(--paper2),var(--deep));border-color:rgba(180,71,45,.4)}.bar{height:100%;min-height:84px;background:var(--red);border-radius:99px}.next p,.card p{color:var(--muted);font-size:13px;line-height:1.5}.sec{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:36px 0 15px}.sec p{margin:0;color:var(--muted);font-size:12px;max-width:430px;text-align:right}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.meta{font:9px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}.bottom{border-top:1px solid var(--rule);padding-top:13px;margin-top:16px;display:flex;justify-content:space-between;align-items:center}.status{border:1px solid var(--rule);border-radius:999px;padding:5px 8px;font:8px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.status.live{color:var(--sage)}.journey{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.step{border:1px solid var(--rule);background:rgba(251,248,241,.55);border-radius:7px;padding:15px;cursor:pointer}.step.on{border-color:var(--red);box-shadow:inset 0 -3px 0 var(--red)}.step b{display:block;color:var(--red);font:9px var(--mono)}.step strong{display:block;font:18px var(--serif);margin-top:13px}.step small{display:block;color:var(--muted);font-size:10px;line-height:1.4;margin-top:8px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-top:14px}.field label{display:block;font:9px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--rule);background:var(--paper2);border-radius:5px;color:var(--ink)}.field textarea{min-height:100px;resize:vertical}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.list{display:grid;gap:11px}.item{border:1px solid var(--rule);background:rgba(251,248,241,.6);border-radius:7px;padding:16px;display:flex;justify-content:space-between;gap:14px;align-items:center}.item strong{font:17px var(--serif)}.item span{display:block;color:var(--muted);font-size:11px;margin-top:4px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{border:1px solid var(--rule);background:rgba(251,248,241,.6);padding:17px;border-radius:7px}.stat strong{font:28px var(--serif)}.stat span{display:block;font:9px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:7px}.studio-actions{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:24px 0}.studio-actions button{border:1px solid var(--rule);background:rgba(251,248,241,.6);padding:15px;border-radius:7px;text-align:left;cursor:pointer}.studio-actions b{display:block;color:var(--red);font:11px var(--mono)}.studio-actions strong{display:block;font:16px var(--serif);margin-top:10px}.table{overflow:auto;border:1px solid var(--rule);border-radius:7px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:11px;border-bottom:1px solid var(--rule);text-align:left;font-size:12px}th{font:9px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}.toast{position:fixed;right:18px;bottom:18px;background:var(--ink);color:var(--paper);padding:10px 13px;border-radius:5px;opacity:0;transition:.2s}.toast.show{opacity:1}.demo{padding:8px 14px;text-align:center;background:var(--deep);border-bottom:1px solid var(--rule);color:var(--muted);font:9px var(--mono);letter-spacing:.08em;text-transform:uppercase}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:none}.hero,.two{grid-template-columns:1fr}.id{border-left:0;border-top:1px solid var(--rule);padding:18px 0 0}.cards{grid-template-columns:1fr 1fr}.journey{overflow:auto;grid-template-columns:repeat(5,190px)}.studio-actions{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}main{padding:26px 20px}}@media(max-width:600px){.cards,.two,.studio-actions,.stats{grid-template-columns:1fr}h1{font-size:40px}.next{grid-template-columns:6px 1fr}.next .cta{grid-column:2}.sec{display:block}.sec p{text-align:left;margin-top:7px}.brand small{display:none}}
</style>
</head>
<body>
<div class="demo">Interactive staging preview · changes are stored only in this browser</div>
<div class="top"><div class="brand">Vinay <em>Pasricha</em><small>AI for Business Leaders</small></div><div class="switch"><button id="participantMode" class="on">Participant</button><button id="studioMode">Vinay Studio</button></div></div>
<div class="layout"><aside id="side"></aside><main id="main"></main></div><div class="toast" id="toast"></div>
<script src="/ai-business-leaders/auth-client.js"></script>
<script>
/* Two modes, one design. Served at /ai-business-leaders/workspace-preview this
   page is the standalone design mock and runs off `seed` below. Served at
   /ai-business-leaders/workspace/<slug> it is the real participant workspace:
   the seed is ignored and every screen is built from that participant's own
   record. */
const ABL_SLUG=(function(){var m=location.pathname.match(/\/ai-business-leaders\/workspace\/([^/]+)\/?$/);return m?decodeURIComponent(m[1]):''}());
const K='abl_workspace_preview_v1';const META=[null,['See the Difference','Beyond personal productivity'],['Find the Leverage','Choose the problem worth solving'],['Redesign the Work','Build the Company Brain workflow'],['Redesign for Reality','Move from workflow map to governed pilot'],['Defend and Commit','Complete the 90-day charter']];
const seed={mode:'participant',page:'home',studio:'dashboard',current:1,selected:'p1',participants:[{id:'p1',name:'Vinay Pasricha',email:'vinay@example.com',phone:'+91 98100 00000',company:'GoodSpace AI',role:'Founder & CEO',cohort:'c1',invite:'active',started:true},{id:'p2',name:'Aashni Shah',email:'aashni@example.com',phone:'+91 98195 55755',company:'Ashinfo',role:'Director',cohort:'c1',invite:'invited',started:false}],cohorts:[{id:'c1',name:'Cohort 1 · Friday 11:30 AM',meeting:'https://meet.google.com/example',current:1},{id:'c2',name:'Cohort 2 · Friday 4:00 PM',meeting:'https://meet.google.com/example2',current:1}],materials:[{id:'m1',title:'Participant-Facing Course Manual',type:'Manual',session:0,phase:'library',status:'published',audience:'all',cohort:''},{id:'m2',title:'Meridian Decision Brief',type:'Case study',session:1,phase:'before',status:'published',audience:'cohort',cohort:'c1'},{id:'m3',title:'Session 1 Presentation',type:'Presentation',session:1,phase:'during',status:'published',audience:'cohort',cohort:'c1'},{id:'m4',title:'Session 1 Recording',type:'Recording',session:1,phase:'after',status:'draft',audience:'cohort',cohort:'c1'}],assignments:[{id:'a1',title:'My AI-Assisted Operating Rhythm',session:1,instructions:'Describe one recurring leadership rhythm, what gets lost today, and what a better AI-assisted rhythm should produce.',cohort:'c1',status:'published'}],submissions:{a1:{status:'draft',text:''}},announcements:[{id:'n1',title:'Welcome to the course',message:'Your Session 1 case study is now available.',cohort:'c1',status:'published'}],notebook:{objective:'Build an operating rhythm that converts scattered updates into reliable action.',constraint:'Follow-up is inconsistent across email, WhatsApp and meetings.',brain:'Memory + Action',project:'AI-assisted reporting and commitment tracking'},initiative:{problem:'Reporting and follow-up remain fragmented across channels.',owner:'Chief of Staff',day30:'One department producing a weekly AI-assisted report.',day90:'Company-wide operating rhythm.',decision:'Fix'}};
let S;if(ABL_SLUG){S=Object.assign({},seed,{live:true,participants:[],cohorts:[],materials:[],assignments:[],announcements:[],submissions:{}})}else{try{S=Object.assign({},seed,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){S=seed}}
/* The mock persists its whole state so the design can be clicked through. A
   real workspace must not keep a participant's record in localStorage, so live
   mode stores only which page they were last on, keyed by slug. */
function save(){try{if(S.live){localStorage.setItem(K+':'+ABL_SLUG,JSON.stringify({page:S.page}))}else{localStorage.setItem(K,JSON.stringify(S))}}catch(e){}}function esc(v){return String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}function p(){return S.participants.find(x=>x.id===S.selected)||S.participants[0]}function c(){return S.cohorts.find(x=>x.id===p().cohort)}function mats(){return S.materials.filter(x=>x.status==='published'&&(x.audience==='all'||x.cohort===p().cohort))}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1500)}function nav(id,label){return `<button class="nav ${S.page===id?'on':''}" data-page="${id}">${label}</button>`}function snav(id,label){return `<button class="nav ${S.studio===id?'on':''}" data-studio="${id}">${label}</button>`}
function renderSide(){let x=document.getElementById('side');if(S.mode==='participant'){x.innerHTML=`<div class="ws"><small>AI for Business Leaders</small><h2>${esc(p().name.split(' ')[0])}’s AI Leadership Workspace</h2><p>${esc(c()?.name||'Unassigned')}</p></div><div class="group"><div class="label">Continue</div>${nav('home','Home')}${nav('journey',p().started?'Resume my AI Journey':'Start my AI Journey')}${nav('session','Current session')}</div><div class="group"><div class="label">Course</div>${[1,2,3,4,5].map(n=>nav('s'+n,'0'+n+' · '+META[n][0])).join('')}</div><div class="group"><div class="label">My Work</div>${nav('notebook','My Course Notebook')}${nav('assignments','Assignments')}${nav('initiative','My 90-Day Initiative')}</div><div class="group"><div class="label">Library</div>${nav('library','All materials')}${nav('recordings','Recordings')}</div>`}else{x.innerHTML=`<div class="ws"><small>Private administration</small><h2>Vinay Studio</h2><p>AI for Business Leaders</p></div><div class="group"><div class="label">Manage</div>${snav('dashboard','Studio home')}${snav('participants','Participants')}${snav('cohorts','Cohorts')}${snav('materials','Course material')}${snav('assignments','Assignments')}${snav('announcements','Announcements')}</div>`}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{if(S.live&&b.dataset.page==='journey'){location.href=journeyHref();return}S.page=b.dataset.page;save();render()});document.querySelectorAll('[data-studio]').forEach(b=>b.onclick=()=>{S.studio=b.dataset.studio;save();render()})}
/* The three guided conversations. Each is a real runtime, not a screen in this
   page: 01 is the course-preparation agent, 02 and 03 are the VED and SIV
   engines. Live mode only — the design mock has no participant to address. */
function runtimeCards(){
  let slug=encodeURIComponent(ABL_SLUG);
  let r=[
    ['01','Context · course preparation','My <em>AI Journey</em>','Tell the system about your company, your role, where AI is already showing up, and what you want this course to change.','A personalised Course Preparation Brief','/ai-business-leaders/s/'+slug],
    ['02','VED · Vinay’s Execution Doctrine','Find My Weakest <em>Execution Link</em>','Trace an important outcome through its sequence, constraints, capacity and handoffs. Find the link governing performance now.','An Execution Constraint Map','/ai-business-leaders/workspace/'+slug+'/ved'],
    ['03','SIV · Socratic, Iterative, Vinay','Choose My First <em>AI Project</em>','Bring your possible AI projects into the open. Test value, feasibility, risk, readiness and timing before choosing where to begin.','A First-Project Decision Artefact','/ai-business-leaders/workspace/'+slug+'/siv']
  ];
  return '<div class="sec"><h2>Three guided conversations</h2><p>Course preparation becomes decision-ready ground before the first live session.</p></div><div class="cards">'+
    r.map(function(c){return '<div class="card"><div class="meta">'+c[0]+' · '+esc(c[1])+'</div><h3>'+c[2]+'</h3><p>'+esc(c[3])+'</p><div class="bottom"><span class="status">'+esc(c[4])+'</span><a class="btn" href="'+c[5]+'">Open →</a></div></div>'}).join('')+
    '</div>';
}
function material(m){return `<div class="card"><div class="meta">${esc(typeLabel(m))} · ${m.session?'Session '+m.session:'Library'}</div><h3>${esc(m.title)}</h3><p>${m.phase==='before'?'Prepare before the session':m.phase==='during'?'Use during the session':m.phase==='after'?'Available after the session':'Permanent resource'}</p><div class="bottom"><span class="status live">Published</span>${S.live?openControl(m):'<button class="btn" onclick="toast(\'Opened in preview\')">Open</button>'}</div></div>`}
function home(){let x=p(),co=c(),ms=mats();return `<div class="hero"><div><p class="eyebrow">AI for Business Leaders · Personal workspace</p><h1>${esc(x.name.split(' ')[0])}’s AI Leadership Workspace</h1><p class="lede">Your course, working notes, first AI initiative and every resource published for your cohort—kept together permanently.</p></div><div class="id"><div class="label">Prepared for</div><strong>${esc(x.name)}</strong><span>${esc(x.role)} · ${esc(x.company)}</span><span>${esc(co?.name||'')}</span></div></div><div class="panel next"><div class="bar"></div><div><div class="eyebrow">Your next step · Optional</div><h2>${x.started?'Resume your AI Journey':'Start your AI Journey'}</h2><p>${x.started?'Continue from your last saved point.':'Confirm your company context and what you want the course to change.'}</p></div><div class="cta"><button class="btn red" id="goJourney">${x.started?'Resume':'Start now'} →</button></div></div><div class="sec"><h2>Current session</h2><p>The latest session and materials always appear first.</p></div><div class="panel two"><div><p class="eyebrow">Session ${S.current}</p><h2>${META[S.current][0]}</h2><p class="lede" style="font-size:16px">${META[S.current][1]}</p><div class="actions"><button class="btn dark" id="openSession">Open session</button><a class="btn" href="${esc(co?.meeting||'#')}" target="_blank">Join live ↗</a></div></div><div class="card"><div class="meta">Available now</div><h3>${ms.filter(m=>m.session===S.current).length} materials</h3><p>Cases, slides, recordings and reading.</p></div></div><div class="sec"><h2>Five-session journey</h2><p>Nothing is locked.</p></div><div class="journey">${[1,2,3,4,5].map(n=>`<div class="step ${n===S.current?'on':''}" data-open="${n}"><b>0${n}</b><strong>${META[n][0]}</strong><small>${META[n][1]}</small></div>`).join('')}</div>${S.live?runtimeCards():''}<div class="sec"><h2>New in your workspace</h2></div><div class="cards">${ms.slice(0,3).map(material).join('')}</div>${S.announcements.filter(a=>a.status==='published'&&(!a.cohort||a.cohort===x.cohort)).map(a=>`<div class="panel" style="margin-top:15px"><strong>${esc(a.title)}</strong><p>${esc(a.message)}</p></div>`).join('')}`}
function session(n){let ms=mats().filter(m=>m.session===n);return `<p class="eyebrow">Session ${n}</p><h1>${META[n][0]}</h1><p class="lede">${META[n][1]}</p>${[['before','Before the session'],['during','During the session'],['after','After the session']].map(row=>`<div class="panel" style="margin-top:14px"><div class="sec" style="margin:0"><h2>${row[1]}</h2></div><div class="cards">${ms.filter(m=>m.phase===row[0]).map(material).join('')||'<div class="card">Nothing published yet.</div>'}</div></div>`).join('')}`}
function journey(){return `<p class="eyebrow">Guided conversation</p><h1>${p().started?'Resume your AI Journey':'Start your AI Journey'}</h1><p class="lede">Build the context for your Company Brain diagnosis and first AI project.</p><div class="panel"><div class="field"><label>Your current priority</label><textarea id="j1">${esc(S.notebook.objective)}</textarea></div><div class="two"><div class="field"><label>Where work breaks</label><textarea id="j2">${esc(S.notebook.constraint)}</textarea></div><div class="field"><label>Company Brain hypothesis</label><textarea id="j3">${esc(S.notebook.brain)}</textarea></div></div><div class="actions"><button class="btn red" id="saveJourney">Save and continue</button><button class="btn" id="skip">Skip for now</button></div></div>`}
/* "My AI Journey" is the course-preparation runtime, not a form on this page.
   The mock had a local stand-in for it; live mode sends the participant to the
   real conversation so nothing they write is trapped in this browser. */
function journeyHref(){return '/ai-business-leaders/s/'+encodeURIComponent(ABL_SLUG)}

/* Studio stores a material's type as a lowercase key. Render the label a
   participant should read, and match on the key, never on the label. */
const TYPE_LABELS={case:'Case study',manual:'Course manual',presentation:'Presentation',recording:'Session recording',reading:'Recommended reading',template:'Template',resource:'Additional resource'};
function typeKey(m){return String((m&&m.type)||'').toLowerCase()}
function typeLabel(m){let k=typeKey(m);return TYPE_LABELS[k]||(k?k.charAt(0).toUpperCase()+k.slice(1):'Resource')}
/* A material is only openable when Studio was given a link for it. */
function openControl(m){return m&&m.url
  ? '<a class="btn" href="'+esc(m.url)+'" target="_blank" rel="noopener">Open ↗</a>'
  : '<span class="meta">No link yet</span>'}

/* Each notebook line is one Initiative Builder field, so editing here writes to
   the same record the Builder reads. Every row therefore needs exactly one
   (session, field) target — no fallbacks — or a save would be ambiguous. */
const NOTE_ROWS=[
  ['objective','Leadership objective',2,'problem_sentence'],
  ['constraint','Weakest execution link',1,'where_work_breaks'],
  ['brain','Company Brain',1,'company_brain_hypothesis'],
  ['project','First AI project',3,'build_buy_partner']
];
function notebook(){return `<p class="eyebrow">My Work</p><h1>My Course Notebook</h1><p class="lede">One cumulative record of what you establish.</p><div class="list">${NOTE_ROWS.map(function(r){
  let key=r[0],label=r[1],value=S.notebook[key]||'';
  if(S.editing===key){
    return '<div class="item" style="display:block"><strong>'+esc(label)+'</strong><div class="field"><textarea data-note-input="'+key+'" placeholder="Write it in your own words.">'+esc(value)+'</textarea></div><div class="actions"><button class="btn dark" data-note-save="'+key+'">Save</button><button class="btn" data-note-cancel="1">Cancel</button><span class="meta" style="align-self:center">Saved to Session '+r[2]+' of your Initiative Builder</span></div></div>';
  }
  return '<div class="item"><div><strong>'+esc(label)+'</strong><span>'+(value?esc(value):'Not established yet.')+'</span></div><button class="btn" data-note-edit="'+key+'">Edit</button></div>';
}).join('')}</div>`}
function assignments(){let a=S.assignments.filter(x=>x.status==='published'&&x.cohort===p().cohort);return `<p class="eyebrow">My Work</p><h1>Assignments</h1><p class="lede">Save a draft and submit when ready.</p>${a.map(x=>{let s=S.submissions[x.id]||{status:'not_started',text:''};return `<div class="panel" style="margin-top:14px"><div class="sec" style="margin:0"><h2>${esc(x.title)}</h2><span class="status ${s.status==='submitted'?'live':''}">${esc(s.status)}</span></div><p>${esc(x.instructions)}</p><div class="field"><label>Your response</label><textarea id="sub_${x.id}">${esc(s.text)}</textarea></div><div class="actions"><button class="btn" data-draft="${x.id}">Save draft</button><button class="btn red" data-submit="${x.id}">Submit</button></div></div>`}).join('')}`}
/* Match the stored type key. Comparing against the display label ("Recording")
   silently emptied this screen, because Studio stores "recording". */
function library(rec){let ms=mats().filter(m=>!rec||typeKey(m)==='recording');return `<p class="eyebrow">Permanent library</p><h1>${rec?'Session Recordings':'All Course Materials'}</h1><div class="list">${ms.map(m=>`<div class="item"><div><strong>${esc(m.title)}</strong><span>${esc(typeLabel(m))} · ${m.session?'Session '+m.session:'Library'}</span></div>${S.live?openControl(m):'<button class="btn" onclick="toast(\'Opened in preview\')">Open</button>'}</div>`).join('')||'<div class="card">Nothing published yet.</div>'}</div>`}
/* Like the notebook, every line is one Initiative Builder field. The decision
   choices must be the Builder's own — the mock offered Scale/Fix/Stop, which
   the Builder has no value for, so a real decision could never display. */
const INITIATIVE_ROWS=[['problem','ip',2,'problem_sentence'],['owner','io',4,'ownership'],['day30','i30',4,'pilot_boundary'],['day90','i90',5,'scale_if'],['decision','idec',2,'decision']];
const DECISIONS=['','Proceed','Investigate before deciding','Wait'];
function initiative(){let i=S.initiative;let opts=S.live?DECISIONS:['Scale','Fix','Stop'];return `<p class="eyebrow">After the course</p><h1>My 90-Day Initiative</h1><div class="panel"><div class="field"><label>Business problem</label><textarea id="ip">${esc(i.problem)}</textarea></div><div class="two"><div class="field"><label>Owner</label><input id="io" value="${esc(i.owner)}"></div><div class="field"><label>Decision</label><select id="idec">${opts.map(o=>'<option value="'+esc(o)+'"'+(i.decision===o?' selected':'')+'>'+esc(o||'Not decided yet')+'</option>').join('')}</select></div></div><div class="two"><div class="field"><label>Day-30 evidence</label><textarea id="i30">${esc(i.day30)}</textarea></div><div class="field"><label>Day-90 target</label><textarea id="i90">${esc(i.day90)}</textarea></div></div><div class="actions"><button class="btn dark" id="saveI">Save initiative</button></div></div>`}
function studioHome(){return `<p class="eyebrow">Private administration</p><h1>Vinay Studio</h1><p class="lede">Manage people, cohorts, materials, assignments and announcements from one simple place.</p><div class="studio-actions">${[['participants','P','Manage participants'],['cohorts','C','Manage cohorts'],['materials','M','Publish material'],['assignments','A','Review assignments'],['announcements','N','Send announcement']].map(x=>`<button data-jump="${x[0]}"><b>${x[1]}</b><strong>${x[2]}</strong></button>`).join('')}</div><div class="stats"><div class="stat"><strong>${S.participants.length}</strong><span>Participants</span></div><div class="stat"><strong>${S.cohorts.length}</strong><span>Cohorts</span></div><div class="stat"><strong>${S.materials.filter(m=>m.status==='published').length}</strong><span>Published items</span></div><div class="stat"><strong>${S.participants.filter(p=>p.invite==='active').length}</strong><span>Active</span></div></div>`}
function studioParticipants(){return `<p class="eyebrow">Vinay Studio</p><h1>Participants</h1><div class="panel"><div class="two"><div class="field"><label>Name</label><input id="pn"></div><div class="field"><label>Email</label><input id="pe"></div><div class="field"><label>Phone</label><input id="pp"></div><div class="field"><label>Cohort</label><select id="pc"><option value="">Unassigned</option>${S.cohorts.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div></div><div class="actions"><button class="btn red" id="addP">Add participant</button></div></div><div class="sec"><h2>All participants</h2></div><div class="table"><table><tr><th>Participant</th><th>Email</th><th>Phone</th><th>Cohort</th><th>Status</th><th>Actions</th></tr>${S.participants.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${esc(x.phone)}</td><td><select data-cohort="${x.id}">${S.cohorts.map(co=>`<option value="${co.id}" ${x.cohort===co.id?'selected':''}>${esc(co.name)}</option>`).join('')}</select></td><td>${esc(x.invite)}</td><td><button class="btn" data-invite="${x.id}">${x.invite==='not_invited'?'Send invite':'Resend'}</button> <button class="btn dark" data-preview="${x.id}">Preview</button></td></tr>`).join('')}</table></div>`}
function studioCohorts(){return `<p class="eyebrow">Vinay Studio</p><h1>Cohorts</h1><div class="panel"><div class="two"><div class="field"><label>Name</label><input id="cn"></div><div class="field"><label>Meeting link</label><input id="cm"></div></div><div class="actions"><button class="btn red" id="addC">Create cohort</button></div></div><div class="sec"><h2>Current cohorts</h2></div><div class="cards">${S.cohorts.map(x=>`<div class="card"><div class="meta">${S.participants.filter(pp=>pp.cohort===x.id).length} participants</div><h3>${esc(x.name)}</h3><p>${esc(x.meeting)}</p><div class="bottom"><select data-current="${x.id}">${[1,2,3,4,5].map(n=>`<option ${x.current===n?'selected':''}>${n}</option>`).join('')}</select><span class="status live">Active</span></div></div>`).join('')}</div>`}
function studioMaterials(){return `<p class="eyebrow">Vinay Studio</p><h1>Publish Course Material</h1><div class="panel"><div class="two"><div class="field"><label>Title</label><input id="mt"></div><div class="field"><label>Type</label><select id="mtype"><option>Case study</option><option>Manual</option><option>Presentation</option><option>Recording</option><option>Reading</option></select></div><div class="field"><label>Session</label><select id="ms"><option value="0">Library</option>${[1,2,3,4,5].map(n=>`<option value="${n}">Session ${n}</option>`).join('')}</select></div><div class="field"><label>Phase</label><select id="mph"><option value="before">Before</option><option value="during">During</option><option value="after">After</option><option value="library">Library</option></select></div><div class="field"><label>Audience</label><select id="ma"><option value="all">Everyone</option><option value="cohort">One cohort</option></select></div><div class="field"><label>Cohort</label><select id="mc"><option value="">—</option>${S.cohorts.map(co=>`<option value="${co.id}">${esc(co.name)}</option>`).join('')}</select></div></div><div class="actions"><button class="btn" id="draftM">Save draft</button><button class="btn red" id="pubM">Publish now</button></div></div><div class="sec"><h2>All materials</h2></div><div class="cards">${S.materials.map(material).join('')}</div>`}
function studioAssignments(){return `<p class="eyebrow">Vinay Studio</p><h1>Assignments</h1><div class="panel"><div class="two"><div class="field"><label>Title</label><input id="at"></div><div class="field"><label>Session</label><select id="as">${[1,2,3,4,5].map(n=>`<option>${n}</option>`).join('')}</select></div><div class="field"><label>Cohort</label><select id="ac">${S.cohorts.map(co=>`<option value="${co.id}">${esc(co.name)}</option>`).join('')}</select></div><div class="field"><label>Instructions</label><textarea id="ai"></textarea></div></div><div class="actions"><button class="btn red" id="pubA">Publish assignment</button></div></div><div class="sec"><h2>Existing assignments</h2></div><div class="cards">${S.assignments.map(a=>`<div class="card"><div class="meta">Session ${a.session}</div><h3>${esc(a.title)}</h3><p>${esc(a.instructions)}</p></div>`).join('')}</div>`}
function studioAnnouncements(){return `<p class="eyebrow">Vinay Studio</p><h1>Announcements</h1><div class="panel"><div class="two"><div class="field"><label>Title</label><input id="nt"></div><div class="field"><label>Cohort</label><select id="nc"><option value="">Everyone</option>${S.cohorts.map(co=>`<option value="${co.id}">${esc(co.name)}</option>`).join('')}</select></div></div><div class="field"><label>Message</label><textarea id="nm"></textarea></div><div class="actions"><button class="btn red" id="pubN">Publish</button><button class="btn" id="wa">Prepare WhatsApp message</button></div></div><div class="sec"><h2>Published announcements</h2></div><div class="list">${S.announcements.map(a=>`<div class="item"><div><strong>${esc(a.title)}</strong><span>${esc(a.message)}</span></div><span class="status live">${esc(a.status)}</span></div>`).join('')}</div>`}
function renderMain(){let m=document.getElementById('main');if(S.mode==='participant'){if(S.page==='home')m.innerHTML=home();else if(S.page==='journey')m.innerHTML=journey();else if(S.page==='notebook')m.innerHTML=notebook();else if(S.page==='assignments')m.innerHTML=assignments();else if(S.page==='initiative')m.innerHTML=initiative();else if(S.page==='library')m.innerHTML=library(false);else if(S.page==='recordings')m.innerHTML=library(true);else if(S.page==='session')m.innerHTML=session(S.current);else if(/^s\d$/.test(S.page))m.innerHTML=session(Number(S.page.slice(1)));wireParticipant()}else{if(S.studio==='participants')m.innerHTML=studioParticipants();else if(S.studio==='cohorts')m.innerHTML=studioCohorts();else if(S.studio==='materials')m.innerHTML=studioMaterials();else if(S.studio==='assignments')m.innerHTML=studioAssignments();else if(S.studio==='announcements')m.innerHTML=studioAnnouncements();else m.innerHTML=studioHome();wireStudio()}}
/* Notebook editing. In live mode a save is a real write to the Builder record;
   in the design mock it stays in this browser, as the rest of the mock does. */
function wireNotebook(){
  document.querySelectorAll('[data-note-edit]').forEach(function(b){b.onclick=function(){S.editing=b.dataset.noteEdit;render()}});
  document.querySelectorAll('[data-note-cancel]').forEach(function(b){b.onclick=function(){S.editing=null;render()}});
  document.querySelectorAll('[data-note-save]').forEach(function(b){b.onclick=async function(){
    let key=b.dataset.noteSave,row=NOTE_ROWS.find(function(r){return r[0]===key});
    let box=document.querySelector('[data-note-input="'+key+'"]');
    if(!box||!row)return;
    let value=box.value.trim();
    b.disabled=true;
    if(S.live){
      try{
        let body={session:row[2],data:{}};body.data[row[3]]=value;
        let res=await fetch('/api/abl/course/'+encodeURIComponent(ABL_SLUG),{method:'PATCH',headers:Object.assign({'Content-Type':'application/json'},window.AblAuth?window.AblAuth.headers({}):{}),body:JSON.stringify(body)});
        if(!res.ok)throw new Error('save failed');
      }catch(e){b.disabled=false;toast('That could not be saved — please try again');return}
    }
    S.notebook[key]=value;S.editing=null;save();toast('Saved');render();
  }});
}
function wireParticipant(){wireNotebook();wireInitiative();let g=document.getElementById('goJourney');if(g)g.onclick=()=>{if(S.live){location.href=journeyHref();return}S.page='journey';save();render()};let o=document.getElementById('openSession');if(o)o.onclick=()=>{S.page='session';save();render()};document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{S.page='s'+b.dataset.open;save();render()});let sj=document.getElementById('saveJourney');if(sj)sj.onclick=()=>{p().started=true;S.notebook.objective=document.getElementById('j1').value;S.notebook.constraint=document.getElementById('j2').value;S.notebook.brain=document.getElementById('j3').value;save();toast('AI Journey saved');render()};let sk=document.getElementById('skip');if(sk)sk.onclick=()=>{S.page='home';save();render()};document.querySelectorAll('[data-draft]').forEach(b=>b.onclick=()=>saveSubmission(b.dataset.draft,'draft'));document.querySelectorAll('[data-submit]').forEach(b=>b.onclick=()=>saveSubmission(b.dataset.submit,'submitted'));}
/* The initiative spans three Builder sessions, so a save is grouped per session
   and sent as one request each. A failure leaves the form as typed. */
function wireInitiative(){
  let si=document.getElementById('saveI');
  if(!si)return;
  si.onclick=async function(){
    let next={},bySession={};
    INITIATIVE_ROWS.forEach(function(r){
      let el=document.getElementById(r[1]);
      if(!el)return;
      let value=String(el.value||'').trim();
      next[r[0]]=value;
      (bySession[r[2]]=bySession[r[2]]||{})[r[3]]=value;
    });
    si.disabled=true;
    if(S.live){
      try{
        for(let n of Object.keys(bySession)){
          let res=await fetch('/api/abl/course/'+encodeURIComponent(ABL_SLUG),{method:'PATCH',headers:Object.assign({'Content-Type':'application/json'},window.AblAuth?window.AblAuth.headers({}):{}),body:JSON.stringify({session:Number(n),data:bySession[n]})});
          if(!res.ok)throw new Error('save failed');
        }
      }catch(e){si.disabled=false;toast('That could not be saved — please try again');return}
    }
    S.initiative=next;si.disabled=false;save();toast('Initiative saved');
  };
}function saveSubmission(id,status){let text=document.getElementById('sub_'+id).value;S.submissions[id]={status,text};save();
/* In live mode the draft/submission is a real write, not a mock. */
if(S.live){fetch('/api/abl/workspace/'+encodeURIComponent(ABL_SLUG)+'/submissions/'+encodeURIComponent(id),{method:'PATCH',headers:Object.assign({'Content-Type':'application/json'},window.AblAuth?window.AblAuth.headers({}):{}),body:JSON.stringify({status,response_text:text})}).then(r=>{if(!r.ok)toast('That could not be saved — please try again')}).catch(()=>toast('That could not be saved — please try again'))}
toast(status==='submitted'?'Submitted':'Draft saved');render()}
function wireStudio(){document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{S.studio=b.dataset.jump;save();render()});let ap=document.getElementById('addP');if(ap)ap.onclick=()=>{let name=document.getElementById('pn').value,email=document.getElementById('pe').value;if(!name||!email)return toast('Name and email required');S.participants.push({id:'p'+Date.now(),name,email,phone:document.getElementById('pp').value,company:'To be added',role:'',cohort:document.getElementById('pc').value,invite:'not_invited',started:false});save();render()};document.querySelectorAll('[data-cohort]').forEach(s=>s.onchange=()=>{S.participants.find(x=>x.id===s.dataset.cohort).cohort=s.value;save();toast('Cohort updated')});document.querySelectorAll('[data-invite]').forEach(b=>b.onclick=()=>{S.participants.find(x=>x.id===b.dataset.invite).invite='invited';save();toast('Invite prepared');render()});document.querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>{S.selected=b.dataset.preview;S.mode='participant';S.page='home';save();render()});let ac=document.getElementById('addC');if(ac)ac.onclick=()=>{let name=document.getElementById('cn').value;if(!name)return toast('Name required');S.cohorts.push({id:'c'+Date.now(),name,meeting:document.getElementById('cm').value,current:1});save();render()};document.querySelectorAll('[data-current]').forEach(s=>s.onchange=()=>{S.cohorts.find(x=>x.id===s.dataset.current).current=Number(s.value);S.current=Number(s.value);save();toast('Current session updated')});let dm=document.getElementById('draftM');if(dm)dm.onclick=()=>addMaterial('draft');let pm=document.getElementById('pubM');if(pm)pm.onclick=()=>addMaterial('published');let pa=document.getElementById('pubA');if(pa)pa.onclick=()=>{let title=document.getElementById('at').value;if(!title)return toast('Title required');S.assignments.push({id:'a'+Date.now(),title,session:Number(document.getElementById('as').value),instructions:document.getElementById('ai').value,cohort:document.getElementById('ac').value,status:'published'});save();render()};let pn=document.getElementById('pubN');if(pn)pn.onclick=()=>{let title=document.getElementById('nt').value,message=document.getElementById('nm').value;if(!title||!message)return toast('Title and message required');S.announcements.unshift({id:'n'+Date.now(),title,message,cohort:document.getElementById('nc').value,status:'published'});save();render()};let w=document.getElementById('wa');if(w)w.onclick=()=>{navigator.clipboard?.writeText('*'+document.getElementById('nt').value+'*\n\n'+document.getElementById('nm').value+'\n\nOpen your AI Leadership Workspace.');toast('WhatsApp message copied')}}function addMaterial(status){let title=document.getElementById('mt').value;if(!title)return toast('Title required');S.materials.unshift({id:'m'+Date.now(),title,type:document.getElementById('mtype').value,session:Number(document.getElementById('ms').value),phase:document.getElementById('mph').value,status,audience:document.getElementById('ma').value,cohort:document.getElementById('mc').value});save();toast(status==='published'?'Material published':'Draft saved');render()}
function render(){renderSide();renderMain();/* live mode replaces the mode switch with Sign out, so these are absent */let pmb=document.getElementById('participantMode'),smb=document.getElementById('studioMode');if(pmb)pmb.classList.toggle('on',S.mode==='participant');if(smb)smb.classList.toggle('on',S.mode==='studio')}document.getElementById('participantMode').onclick=()=>{S.mode='participant';save();render()};document.getElementById('studioMode').onclick=()=>{S.mode='studio';save();render()};

/* ---- live mode -----------------------------------------------------------
   Map the workspace API payload onto the same shape the design mock renders,
   so one set of screens serves both. The API has already decided what this
   participant may see, so audience/cohort filters are normalised to "visible"
   rather than re-evaluated here. */
function txt(v){return String(v==null?'':v).trim()}
function pick(sessions,n,key){let s=sessions&&sessions[n];return s?txt(s[key]):''}
function fromApi(d){
  let pt=d.participant||{},co=d.cohort||null,cohortId=txt(pt.cohort_id),b=(d.builder&&d.builder.sessions)||{};
  let ui={};try{ui=JSON.parse(localStorage.getItem(K+':'+ABL_SLUG)||'{}')}catch(e){}
  return {
    live:true,mode:'participant',page:ui.page||'home',studio:'dashboard',
    current:(co&&co.current_session)||(d.builder&&d.builder.current_session)||1,
    selected:pt.id,
    participants:[{id:pt.id,name:txt(pt.name),email:txt(pt.email),phone:'',company:txt(pt.company_name),role:txt(pt.role_title),cohort:cohortId,invite:pt.invite_status||'active',started:!!pt.journey_started}],
    cohorts:co?[{id:co.id,name:txt(co.name),meeting:txt(co.meeting_url||co.meeting),current:co.current_session||1}]:[{id:cohortId,name:'',meeting:'',current:1}],
    materials:(d.materials||[]).map(m=>({id:m.id,title:txt(m.title),type:txt(m.type)||'resource',url:txt(m.source_url),file:txt(m.file_name),session:m.session_number||0,phase:m.phase||'library',status:'published',audience:'all',cohort:cohortId})),
    assignments:(d.assignments||[]).map(a=>({id:a.id,title:txt(a.title),session:a.session_number||1,instructions:txt(a.instructions),cohort:cohortId,status:'published'})),
    submissions:Object.fromEntries((d.assignments||[]).map(a=>[a.id,{status:(a.submission&&a.submission.status)||'draft',text:(a.submission&&a.submission.response_text)||''}])),
    announcements:(d.announcements||[]).map(n=>({id:n.id,title:txt(n.title),message:txt(n.message),cohort:'',status:'published'})),
    notebook:{
      objective:pick(b,2,'problem_sentence')||pick(b,1,'candidate_workflow'),
      constraint:pick(b,1,'where_work_breaks'),
      brain:pick(b,1,'company_brain_hypothesis'),
      project:pick(b,3,'build_buy_partner')||pick(b,4,'pilot_boundary'),
    },
    initiative:{
      problem:pick(b,2,'problem_sentence'),
      owner:pick(b,4,'ownership')||pick(b,2,'owner_human_line'),
      day30:pick(b,4,'pilot_boundary'),
      day90:pick(b,5,'scale_if'),
      decision:pick(b,2,'decision'),
    },
  };
}
async function bootLive(){
  let main=document.getElementById('main');
  /* The participant arrives here from the sign-in page. Without a session on
     this device, send them back to it rather than showing a bare workspace. */
  let saved=window.AblAuth&&window.AblAuth.read();
  if(!saved||!saved.token){window.AblAuth.login();return}
  // The mock's banner promises changes stay in this browser. In a real
  // workspace they do not — they are saved to the participant's record.
  let demoBanner=document.querySelector('.demo');
  if(demoBanner)demoBanner.remove();
  document.querySelector('.switch').innerHTML='<button id="ablSignOut">Sign out</button>';
  document.getElementById('ablSignOut').onclick=()=>{window.AblAuth.clear();location.replace('/ai-business-leaders/login')};
  main.innerHTML='<p class="eyebrow">Your workspace</p><h1>Opening your workspace…</h1>';
  try{
    let r=await fetch('/api/abl/workspace/'+encodeURIComponent(ABL_SLUG),{headers:window.AblAuth.headers({Accept:'application/json'})});
    let body=await r.json();
    if(!r.ok||body.ok===false)throw new Error(body.error||'This workspace could not be opened.');
    S=fromApi(body.data);
    render();
  }catch(e){
    main.innerHTML='<p class="eyebrow">Your workspace</p><h1>We could not open this workspace</h1><p class="lede">'+esc(e.message)+'</p><p><a class="btn" href="/ai-business-leaders/login">Sign in again →</a></p>';
  }
}
if(ABL_SLUG){bootLive()}else{render()}
</script>
