<style>
:root{--paper:#f5f0e6;--card:#fbf8f1;--deep:#ebe3d5;--ink:#1d1a17;--muted:#756e64;--rule:rgba(48,42,35,.16);--red:#b4472d;--sage:#647363;--serif:Georgia,serif;--mono:"Courier New",monospace}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif;overflow-x:hidden}button,input,textarea,select{font:inherit}.demo{padding:8px 12px;text-align:center;background:var(--deep);border-bottom:1px solid var(--rule);font:9px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.top{position:sticky;top:0;z-index:50;min-height:64px;padding:9px 12px;border-bottom:1px solid var(--rule);background:rgba(245,240,230,.96);backdrop-filter:blur(12px);display:flex;align-items:center;gap:9px}.menu{display:none;flex:0 0 44px;width:44px;height:44px;border:1px solid var(--rule);border-radius:6px;background:var(--card);font-size:20px}.brand{min-width:0;font:20px/1 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand em{color:var(--red);font-style:normal}.brand small{margin-left:12px;font:9px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.switch{margin-left:auto;display:flex;gap:6px}.switch button,.btn{min-height:42px;border:1px solid var(--rule);border-radius:5px;background:transparent;color:var(--ink);padding:9px 11px;font:9px/1.2 var(--mono);letter-spacing:.07em;text-transform:uppercase;cursor:pointer}.switch button.on,.btn.dark{background:var(--ink);color:var(--paper)}.btn.red{background:var(--red);border-color:var(--red);color:#fff}.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 96px)}aside{border-right:1px solid var(--rule);background:rgba(251,248,241,.55);padding:18px 14px;overflow-y:auto}.workspace{padding:10px 10px 18px;border-bottom:1px solid var(--rule)}.workspace small,.label,.eyebrow{font:9px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--red)}.workspace h2{margin:8px 0 4px;font:23px/1.05 var(--serif)}.workspace p{margin:0;color:var(--muted);font-size:12px}.group{margin-top:18px}.group .label{padding:0 10px 7px;color:#9c9488}.nav{display:block;width:100%;min-height:44px;border:0;border-radius:6px;background:transparent;padding:10px;text-align:left;color:#49423b;cursor:pointer}.nav.on{background:var(--card);box-shadow:inset 3px 0 0 var(--red)}main{width:100%;max-width:1180px;padding:34px 38px 80px}.eyebrow{margin:0 0 10px}h1{margin:0 0 14px;font:48px/.98 var(--serif);letter-spacing:-.03em}h2{margin:0 0 10px;font:30px/1.08 var(--serif)}h3{margin:0 0 8px;font:21px/1.15 var(--serif)}.lede{max-width:760px;font:18px/1.5 var(--serif);color:#454039}.hero{display:grid;grid-template-columns:1.4fr .6fr;gap:34px;align-items:end}.identity{border-left:1px solid var(--rule);padding-left:22px}.identity strong{display:block;margin:8px 0;font:23px var(--serif)}.identity span{display:block;margin-top:4px;color:var(--muted);font-size:12px}.panel,.card{border:1px solid var(--rule);border-radius:8px;background:rgba(251,248,241,.7);padding:22px}.next{margin-top:26px;display:grid;grid-template-columns:7px 1fr auto;gap:18px;align-items:center;background:linear-gradient(120deg,var(--card),var(--deep));border-color:rgba(180,71,45,.4)}.bar{height:100%;min-height:84px;border-radius:99px;background:var(--red)}.next p,.card p{color:var(--muted);font-size:13px;line-height:1.5}.section{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:35px 0 15px}.section p{max-width:430px;margin:0;text-align:right;color:var(--muted);font-size:12px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.meta{font:9px var(--mono);letter-spacing:.11em;text-transform:uppercase;color:#9c9488}.bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:15px;padding-top:13px;border-top:1px solid var(--rule)}.status{display:inline-flex;padding:5px 8px;border:1px solid var(--rule);border-radius:999px;font:8px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.status.live{color:var(--sage)}.journey{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.step{min-height:120px;border:1px solid var(--rule);border-radius:7px;background:rgba(251,248,241,.6);padding:15px;cursor:pointer}.step.on{border-color:var(--red);box-shadow:inset 0 -3px 0 var(--red)}.step b{display:block;color:var(--red);font:9px var(--mono)}.step strong{display:block;margin-top:13px;font:18px var(--serif)}.step small{display:block;margin-top:8px;color:var(--muted);font-size:10px;line-height:1.4}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-top:14px}.field label{display:block;margin-bottom:6px;font:9px var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}.field input,.field textarea,.field select{width:100%;min-height:44px;padding:10px 11px;border:1px solid var(--rule);border-radius:5px;background:var(--card);color:var(--ink)}.field textarea{min-height:105px;resize:vertical}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.list{display:grid;gap:11px}.item{display:flex;align-items:center;justify-content:space-between;gap:14px;border:1px solid var(--rule);border-radius:7px;background:rgba(251,248,241,.65);padding:16px}.item strong{font:17px var(--serif)}.item span{display:block;margin-top:4px;color:var(--muted);font-size:11px}.studio-actions{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:24px 0}.studio-actions button{border:1px solid var(--rule);border-radius:7px;background:rgba(251,248,241,.68);padding:15px;text-align:left}.studio-actions b{display:block;color:var(--red);font:11px var(--mono)}.studio-actions strong{display:block;margin-top:10px;font:16px var(--serif)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{border:1px solid var(--rule);border-radius:7px;background:rgba(251,248,241,.68);padding:17px}.stat strong{font:28px var(--serif)}.stat span{display:block;margin-top:7px;color:var(--muted);font:9px var(--mono);letter-spacing:.1em;text-transform:uppercase}.table{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--rule);border-radius:7px}table{width:100%;min-width:720px;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid var(--rule);text-align:left;font-size:12px}th{font:9px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#9c9488}.overlay{display:none}.toast{position:fixed;right:18px;bottom:18px;z-index:100;background:var(--ink);color:var(--paper);border-radius:5px;padding:10px 13px;font-size:12px;opacity:0;transition:.2s}.toast.show{opacity:1}
@media(max-width:900px){body.menu-open{overflow:hidden}.menu{display:inline-flex;align-items:center;justify-content:center}.brand small{display:none}.shell{display:block}.shell>aside{display:block;position:fixed;left:0;top:var(--drawer-top,64px);z-index:80;width:min(86vw,330px);height:calc(100dvh - var(--drawer-top,64px));padding-bottom:max(24px,env(safe-area-inset-bottom));background:var(--card);box-shadow:18px 0 48px rgba(29,26,23,.24);transform:translateX(-105%);transition:transform .22s ease}.menu-open .shell>aside{transform:translateX(0)}.overlay{display:block;position:fixed;inset:var(--drawer-top,64px) 0 0;z-index:70;border:0;background:rgba(29,26,23,.42);opacity:0;pointer-events:none;transition:.2s}.menu-open .overlay{opacity:1;pointer-events:auto}main{max-width:none;padding:24px 16px calc(70px + env(safe-area-inset-bottom))}h1{font-size:clamp(36px,11vw,48px);overflow-wrap:anywhere}.hero,.two{grid-template-columns:1fr}.identity{border-left:0;border-top:1px solid var(--rule);padding:17px 0 0}.next{grid-template-columns:6px minmax(0,1fr);padding:18px 15px}.next .cta{grid-column:2}.cards{grid-template-columns:1fr}.journey{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding-bottom:10px}.step{flex:0 0 min(78vw,260px);scroll-snap-align:start}.studio-actions{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.item{align-items:flex-start;flex-direction:column}.item>.btn{width:100%}.section{display:block;margin:28px 0 13px}.section p{margin-top:7px;text-align:left}.field input,.field textarea,.field select{font-size:16px}.actions .btn{min-height:44px}.toast{left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));text-align:center}}
@media(max-width:520px){.top{gap:7px}.brand{font-size:18px}.switch button{font-size:8px;padding:8px}.panel,.card{padding:16px}.studio-actions,.stats{grid-template-columns:1fr}.btn{white-space:normal;text-align:center;line-height:1.25}}
</style>
</head>
<body>
<div class="demo">Mobile-first interactive test · changes stay in this browser</div>
<header class="top"><button class="menu" id="menu" aria-label="Open menu" aria-expanded="false">☰</button><div class="brand">Vinay <em>Pasricha</em><small>AI for Business Leaders</small></div><div class="switch"><button id="participantMode" class="on">Participant</button><button id="studioMode">Studio</button></div></header>
<div class="shell"><aside id="side"></aside><main id="main"></main></div><button class="overlay" id="overlay" aria-label="Close menu"></button><div class="toast" id="toast"></div>
<script>
(function(){
const K='abl_mobile_test_v1';const META=[null,['See the Difference','Beyond personal productivity'],['Find the Leverage','Choose the problem worth solving'],['Redesign the Work','Build the Company Brain workflow'],['Redesign for Reality','Move from workflow map to governed pilot'],['Defend and Commit','Complete the 90-day charter']];
const seed={mode:'participant',page:'home',studio:'home',current:1,participants:[{id:'p1',name:'Vinay Pasricha',email:'vinay@example.com',phone:'+91 98100 00000',company:'GoodSpace AI',cohort:'c1',status:'active'},{id:'p2',name:'Aashni Shah',email:'aashni@example.com',phone:'+91 98195 55755',company:'Ashinfo',cohort:'c1',status:'invited'}],cohorts:[{id:'c1',name:'Cohort 1 · Friday 11:30 AM',meeting:'https://meet.google.com/example'},{id:'c2',name:'Cohort 2 · Friday 4:00 PM',meeting:'https://meet.google.com/example2'}],materials:[{id:'m1',title:'Participant-Facing Course Manual',type:'Manual',session:0,phase:'library',status:'published'},{id:'m2',title:'Meridian Decision Brief',type:'Case study',session:1,phase:'before',status:'published'},{id:'m3',title:'Session 1 Presentation',type:'Presentation',session:1,phase:'during',status:'published'}],assignment:{title:'My AI-Assisted Operating Rhythm',text:'',status:'draft'},initiative:{problem:'Reporting and follow-up remain fragmented across channels.',owner:'Chief of Staff',day30:'One department produces a weekly AI-assisted report.',day90:'Company-wide operating rhythm.',decision:'Fix'}};
let S;try{S=Object.assign({},seed,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){S=seed}const $=id=>document.getElementById(id);function save(){localStorage.setItem(K,JSON.stringify(S))}function esc(v){return String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1500)}function closeMenu(){document.body.classList.remove('menu-open');$('menu').textContent='☰';$('menu').setAttribute('aria-expanded','false')}function setTop(){document.documentElement.style.setProperty('--drawer-top',Math.round(document.querySelector('.top').getBoundingClientRect().bottom)+'px')}function nav(id,label){return `<button class="nav ${S.page===id?'on':''}" data-page="${id}">${label}</button>`}function snav(id,label){return `<button class="nav ${S.studio===id?'on':''}" data-studio="${id}">${label}</button>`}
function renderSide(){if(S.mode==='participant')$('side').innerHTML=`<div class="workspace"><small>AI for Business Leaders</small><h2>Vinay’s AI Leadership Workspace</h2><p>Cohort 1 · Friday 11:30 AM</p></div><div class="group"><div class="label">Continue</div>${nav('home','Home')}${nav('journey','Resume my AI Journey')}${nav('session','Current session')}</div><div class="group"><div class="label">My Work</div>${nav('notebook','My Course Notebook')}${nav('assignments','Assignments')}${nav('initiative','My 90-Day Initiative')}</div><div class="group"><div class="label">Library</div>${nav('library','All materials')}${nav('recordings','Recordings')}</div>`;else $('side').innerHTML=`<div class="workspace"><small>Private administration</small><h2>Vinay Studio</h2><p>AI for Business Leaders</p></div><div class="group"><div class="label">Manage</div>${snav('home','Studio home')}${snav('participants','Participants')}${snav('cohorts','Cohorts')}${snav('materials','Course material')}${snav('assignments','Assignments')}${snav('announcements','Announcements')}</div>`;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{S.page=b.dataset.page;save();closeMenu();render()});document.querySelectorAll('[data-studio]').forEach(b=>b.onclick=()=>{S.studio=b.dataset.studio;save();closeMenu();render()})}
function material(m){return `<article class="card"><div class="meta">${esc(m.type)} · ${m.session?'Session '+m.session:'Library'}</div><h3>${esc(m.title)}</h3><p>${m.phase==='before'?'Prepare before the session':m.phase==='during'?'Use during the live session':'Permanent course resource'}</p><div class="bottom"><span class="status live">Published</span><button class="btn" onclick="window.demoToast('Opened in test')">Open</button></div></article>`}window.demoToast=toast;
function home(){return `<div class="hero"><div><p class="eyebrow">Personal workspace</p><h1>Vinay’s AI Leadership Workspace</h1><p class="lede">Your course, working notes, first AI initiative and every resource published for your cohort.</p></div><div class="identity"><div class="label">Prepared for</div><strong>Vinay Pasricha</strong><span>Founder & CEO · GoodSpace AI</span><span>Cohort 1 · Friday 11:30 AM</span></div></div><section class="panel next"><div class="bar"></div><div><p class="eyebrow">Your next step · Optional</p><h2>Resume your AI Journey</h2><p>Continue from your last saved point.</p></div><div class="cta"><button class="btn red" data-go="journey">Resume →</button></div></section><div class="section"><h2>Current session</h2><p>The latest session and materials appear first.</p></div><section class="panel two"><div><p class="eyebrow">Session 1</p><h2>See the Difference</h2><p class="lede" style="font-size:16px">Beyond personal productivity</p><div class="actions"><button class="btn dark" data-go="session">Open session</button><button class="btn">Join live ↗</button></div></div><div class="card"><div class="meta">Available now</div><h3>2 materials</h3><p>Case study and live presentation.</p></div></section><div class="section"><h2>Five-session journey</h2><p>Swipe sideways on mobile. Nothing is locked.</p></div><div class="journey">${[1,2,3,4,5].map(n=>`<div class="step ${n===1?'on':''}" data-session="${n}"><b>0${n}</b><strong>${META[n][0]}</strong><small>${META[n][1]}</small></div>`).join('')}</div><div class="section"><h2>New in your workspace</h2></div><div class="cards">${S.materials.slice(0,3).map(material).join('')}</div>`}
function journey(){return `<p class="eyebrow">Guided conversation</p><h1>Resume your AI Journey</h1><p class="lede">Build the context for your Company Brain diagnosis and first AI project.</p><section class="panel"><div class="field"><label>Your current priority</label><textarea>Build an operating rhythm that converts scattered updates into reliable action.</textarea></div><div class="two"><div class="field"><label>Where work breaks</label><textarea>Follow-up is inconsistent across email, WhatsApp and meetings.</textarea></div><div class="field"><label>Company Brain hypothesis</label><textarea>Memory + Action</textarea></div></div><div class="actions"><button class="btn red" onclick="window.demoToast('Journey saved')">Save and continue</button><button class="btn" data-go="home">Skip for now</button></div></section>`}
function session(){return `<p class="eyebrow">Session 1</p><h1>See the Difference</h1><p class="lede">Beyond personal productivity</p>${[['Before the session','Meridian Decision Brief'],['During the session','Session 1 Presentation'],['After the session','Recording will appear here']].map((r,i)=>`<section class="panel" style="margin-top:14px"><h2>${r[0]}</h2><div class="card"><div class="meta">${i===0?'Case study':i===1?'Presentation':'Recording'}</div><h3>${r[1]}</h3><div class="bottom"><span class="status ${i<2?'live':''}">${i<2?'Published':'Not yet published'}</span><button class="btn">${i<2?'Open':'Waiting'}</button></div></div></section>`).join('')}`}
function notebook(){return `<p class="eyebrow">My Work</p><h1>My Course Notebook</h1><div class="list">${[['Leadership objective','Build a reliable operating rhythm.'],['Weakest execution link','Commitments disappear across channels.'],['Company Brain','Memory + Action'],['First AI project','AI-assisted reporting and follow-up.']].map(r=>`<div class="item"><div><strong>${r[0]}</strong><span>${r[1]}</span></div><button class="btn">Edit</button></div>`).join('')}</div>`}
function assignments(){return `<p class="eyebrow">My Work</p><h1>Assignments</h1><section class="panel"><div class="bottom" style="margin-top:0;padding-top:0;border-top:0"><h2>${esc(S.assignment.title)}</h2><span class="status ${S.assignment.status==='submitted'?'live':''}">${esc(S.assignment.status)}</span></div><p>Describe one recurring leadership rhythm, what gets lost today, and what a better AI-assisted rhythm should produce.</p><div class="field"><label>Your response</label><textarea id="assignmentText">${esc(S.assignment.text)}</textarea></div><div class="actions"><button class="btn" id="draft">Save draft</button><button class="btn red" id="submit">Submit</button></div></section>`}
function initiative(){let i=S.initiative;return `<p class="eyebrow">After the course</p><h1>My 90-Day Initiative</h1><section class="panel"><div class="field"><label>Business problem</label><textarea id="ip">${esc(i.problem)}</textarea></div><div class="two"><div class="field"><label>Owner</label><input id="io" value="${esc(i.owner)}"></div><div class="field"><label>Decision</label><select id="id"><option>Scale</option><option selected>Fix</option><option>Stop</option></select></div></div><div class="two"><div class="field"><label>Day-30 evidence</label><textarea id="i30">${esc(i.day30)}</textarea></div><div class="field"><label>Day-90 target</label><textarea id="i90">${esc(i.day90)}</textarea></div></div><div class="actions"><button class="btn dark" id="saveInitiative">Save initiative</button></div></section>`}
function library(rec){let ms=S.materials.filter(m=>!rec||m.type==='Recording');return `<p class="eyebrow">Permanent library</p><h1>${rec?'Session Recordings':'All Course Materials'}</h1><div class="list">${ms.map(m=>`<div class="item"><div><strong>${esc(m.title)}</strong><span>${esc(m.type)} · ${m.session?'Session '+m.session:'Library'}</span></div><button class="btn">Open</button></div>`).join('')||'<div class="card">No recording has been published yet.</div>'}</div>`}
function studioHome(){return `<p class="eyebrow">Private administration</p><h1>AI for Business Leaders Studio</h1><p class="lede">One place to manage preparation, cohorts, materials, assignments and communication.</p><div class="studio-actions">${[['participants','P','Participants'],['cohorts','C','Cohorts'],['materials','M','Publish material'],['assignments','A','Assignments'],['announcements','N','Announcements']].map(x=>`<button data-studio-go="${x[0]}"><b>${x[1]}</b><strong>${x[2]}</strong></button>`).join('')}</div><div class="stats"><div class="stat"><strong>2</strong><span>Participants</span></div><div class="stat"><strong>2</strong><span>Cohorts</span></div><div class="stat"><strong>3</strong><span>Published items</span></div><div class="stat"><strong>1</strong><span>Active</span></div></div>`}
function participants(){return `<p class="eyebrow">Vinay Studio</p><h1>Participants</h1><section class="panel"><div class="two"><div class="field"><label>Name</label><input id="pn"></div><div class="field"><label>Email</label><input id="pe"></div><div class="field"><label>Phone</label><input id="pp"></div><div class="field"><label>Cohort</label><select><option>Cohort 1</option><option>Cohort 2</option></select></div></div><div class="actions"><button class="btn red" id="addParticipant">Add participant</button></div></section><div class="section"><h2>Master directory</h2><p>Swipe the table sideways on a phone.</p></div><div class="table"><table><tr><th>Participant</th><th>Email</th><th>Phone</th><th>Cohort</th><th>Status</th><th>Action</th></tr>${S.participants.map(p=>`<tr><td>${p.name}</td><td>${p.email}</td><td>${p.phone}</td><td>Cohort 1</td><td>${p.status}</td><td><button class="btn">Preview</button></td></tr>`).join('')}</table></div>`}
function cohorts(){return `<p class="eyebrow">Vinay Studio</p><h1>Cohorts</h1><div class="cards">${S.cohorts.map(c=>`<div class="card"><div class="meta">Current cohort</div><h3>${c.name}</h3><p>${c.meeting}</p><div class="bottom"><span class="status live">Active</span><button class="btn">Edit</button></div></div>`).join('')}</div>`}
function materials(){return `<p class="eyebrow">Vinay Studio</p><h1>Publish Course Material</h1><section class="panel"><div class="two"><div class="field"><label>Title</label><input id="mt"></div><div class="field"><label>Type</label><select><option>Case study</option><option>Presentation</option><option>Recording</option></select></div><div class="field"><label>Session</label><select><option>Session 1</option><option>Session 2</option></select></div><div class="field"><label>Audience</label><select><option>Everyone</option><option>Cohort 1</option></select></div></div><div class="field"><label>File or video link</label><input></div><div class="actions"><button class="btn">Save draft</button><button class="btn red" id="publishMaterial">Publish now</button></div></section><div class="section"><h2>Published materials</h2></div><div class="cards">${S.materials.map(material).join('')}</div>`}
function simpleStudio(title,copy){return `<p class="eyebrow">Vinay Studio</p><h1>${title}</h1><p class="lede">${copy}</p><section class="panel"><div class="field"><label>Title</label><input></div><div class="field"><label>Message or instructions</label><textarea></textarea></div><div class="actions"><button class="btn red" onclick="window.demoToast('Published in test')">Publish</button></div></section>`}
function renderMain(){if(S.mode==='participant'){if(S.page==='journey')$('main').innerHTML=journey();else if(S.page==='session')$('main').innerHTML=session();else if(S.page==='notebook')$('main').innerHTML=notebook();else if(S.page==='assignments')$('main').innerHTML=assignments();else if(S.page==='initiative')$('main').innerHTML=initiative();else if(S.page==='library')$('main').innerHTML=library(false);else if(S.page==='recordings')$('main').innerHTML=library(true);else $('main').innerHTML=home()}else{if(S.studio==='participants')$('main').innerHTML=participants();else if(S.studio==='cohorts')$('main').innerHTML=cohorts();else if(S.studio==='materials')$('main').innerHTML=materials();else if(S.studio==='assignments')$('main').innerHTML=simpleStudio('Assignments','Publish and review simple participant work.');else if(S.studio==='announcements')$('main').innerHTML=simpleStudio('Announcements','Publish to a cohort or everyone.');else $('main').innerHTML=studioHome()}wire()}
function wire(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.page=b.dataset.go;save();render()});document.querySelectorAll('[data-session]').forEach(b=>b.onclick=()=>{S.page='session';save();render()});document.querySelectorAll('[data-studio-go]').forEach(b=>b.onclick=()=>{S.studio=b.dataset.studioGo;save();render()});if($('draft'))$('draft').onclick=()=>{S.assignment.text=$('assignmentText').value;S.assignment.status='draft';save();toast('Draft saved');render()};if($('submit'))$('submit').onclick=()=>{S.assignment.text=$('assignmentText').value;S.assignment.status='submitted';save();toast('Assignment submitted');render()};if($('saveInitiative'))$('saveInitiative').onclick=()=>{S.initiative.problem=$('ip').value;S.initiative.owner=$('io').value;S.initiative.day30=$('i30').value;S.initiative.day90=$('i90').value;save();toast('Initiative saved')};if($('addParticipant'))$('addParticipant').onclick=()=>toast('Participant added in test');if($('publishMaterial'))$('publishMaterial').onclick=()=>toast('Material published in test')}
function render(){renderSide();renderMain();$('participantMode').classList.toggle('on',S.mode==='participant');$('studioMode').classList.toggle('on',S.mode==='studio');setTop()}
$('participantMode').onclick=()=>{S.mode='participant';save();render()};$('studioMode').onclick=()=>{S.mode='studio';save();render()};$('menu').onclick=()=>{let open=document.body.classList.toggle('menu-open');$('menu').textContent=open?'×':'☰';$('menu').setAttribute('aria-expanded',String(open));setTop()};$('overlay').onclick=closeMenu;window.addEventListener('resize',()=>{setTop();if(innerWidth>900)closeMenu()});window.addEventListener('scroll',setTop,{passive:true});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});render();
}());
</script>
</body>
</html>
