<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Leadership Initiative — AI for Business Leaders</title>
  <meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css">
  <style>
    :root { --course-red:#b5462a; --course-gold:#b7892f; --course-green:#39765a; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); }
    .course-shell { max-width:1180px; margin:0 auto; padding:28px 26px 100px; }
    .course-head { display:grid; grid-template-columns:1fr auto; gap:24px; align-items:end; padding-bottom:22px; border-bottom:1px solid var(--rule); }
    .kicker { font:500 10px/1 var(--mono); letter-spacing:.22em; text-transform:uppercase; color:var(--accent); }
    h1 { font:400 clamp(30px,5vw,48px)/1.03 var(--serif); letter-spacing:-.025em; margin:9px 0 6px; }
    .sub { font:italic 400 16px/1.5 var(--serif); color:var(--ink-3); }
    .identity { font:500 11px/1.55 var(--mono); color:var(--ink-3); text-align:right; }
    .identity strong { display:block; color:var(--ink); font-size:13px; }
    .journey { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin:24px 0 18px; }
    .journey button { text-align:left; border:1px solid var(--rule); border-radius:8px; background:var(--paper-3); padding:12px 12px 11px; color:var(--ink-3); cursor:pointer; min-height:86px; }
    .journey button:hover, .journey button.on { border-color:var(--accent); background:var(--paper-2); }
    .journey button.done { box-shadow:inset 0 -3px 0 var(--course-green); }
    .journey .n { font:500 10px/1 var(--mono); color:var(--accent); letter-spacing:.12em; }
    .journey .t { font:400 15px/1.15 var(--serif); color:var(--ink); margin-top:7px; }
    .journey .d { font:500 8px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase; margin-top:8px; }
    .progress { height:5px; border-radius:4px; background:var(--rule-soft); overflow:hidden; }
    .progress > div { height:100%; background:linear-gradient(90deg,var(--course-red),var(--course-gold)); transition:width .3s ease; }
    .progress-copy { display:flex; justify-content:space-between; gap:12px; margin-top:7px; font:500 9px/1.4 var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--ink-4); }
    .safety { margin:26px 0; border-left:3px solid var(--accent); background:var(--paper-3); padding:13px 16px; color:var(--ink-2); font-size:13.5px; line-height:1.55; }
    .layout { display:grid; grid-template-columns:minmax(0,1fr) 270px; gap:30px; align-items:start; }
    .panel { border:1px solid var(--rule); border-radius:12px; background:var(--paper-3); padding:25px; }
    .session-kicker { font:500 10px/1 var(--mono); letter-spacing:.2em; text-transform:uppercase; color:var(--accent); }
    .session-title { font:400 31px/1.08 var(--serif); margin:8px 0 5px; }
    .session-q { font:italic 400 16px/1.5 var(--serif); color:var(--ink-2); margin:0 0 22px; }
    .field { margin:20px 0; }
    .field label { display:block; font:500 10px/1.35 var(--mono); letter-spacing:.13em; text-transform:uppercase; color:var(--ink-2); margin-bottom:7px; }
    .field .help { font:400 13px/1.5 var(--serif); color:var(--ink-3); margin:-2px 0 8px; }
    textarea, input[type=text], input[type=date], select { width:100%; border:1px solid var(--rule); background:var(--paper); border-radius:7px; padding:11px 12px; font:400 15px/1.5 var(--sans); color:var(--ink); }
    textarea { min-height:92px; resize:vertical; }
    textarea:focus, input:focus, select:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 12%,transparent); }
    .check-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .check { display:flex; gap:9px; align-items:flex-start; padding:9px 10px; border:1px solid var(--rule-soft); border-radius:6px; background:var(--paper); font-size:13px; cursor:pointer; }
    .check input { margin-top:2px; accent-color:var(--accent); }
    .triple { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .actions { display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between; align-items:center; padding-top:20px; border-top:1px solid var(--rule); margin-top:24px; }
    .btn { border:0; border-radius:7px; padding:11px 16px; font:500 11px/1 var(--mono); letter-spacing:.08em; cursor:pointer; }
    .btn.primary { background:var(--ink); color:var(--paper); }
    .btn.ghost { border:1px solid var(--rule); background:transparent; color:var(--accent); }
    .save-state { font:500 10px/1.4 var(--mono); color:var(--ink-4); min-width:90px; }
    .side { position:sticky; top:22px; display:grid; gap:14px; }
    .side-card { border:1px solid var(--rule); border-radius:10px; padding:17px; background:var(--paper-3); }
    .side-card h3 { font:500 10px/1 var(--mono); letter-spacing:.17em; text-transform:uppercase; color:var(--accent); margin:0 0 11px; }
    .side-card p, .side-card li { font-size:13px; line-height:1.5; color:var(--ink-2); }
    .side-card ul { margin:0; padding-left:18px; }
    .win { display:none; border-color:color-mix(in srgb,var(--course-green) 45%,var(--rule)); background:color-mix(in srgb,var(--course-green) 6%,var(--paper-3)); }
    .win.show { display:block; }
    .win strong { font:400 18px/1.3 var(--serif); color:var(--course-green); }
    .open-decision { font:italic 400 12.5px/1.45 var(--serif); color:var(--ink-3); margin-top:8px; }
    .charter { display:none; }
    .charter.show { display:block; }
    .charter-preview { max-height:460px; overflow:auto; border:1px solid var(--rule); border-radius:7px; background:var(--paper); padding:18px; font-size:14px; line-height:1.55; white-space:pre-wrap; }
    .error { border:1px solid var(--accent); border-radius:8px; padding:14px; color:var(--accent); background:var(--paper-3); }
    @media(max-width:820px) {
      .course-shell { padding:20px 16px 80px; }
      .course-head { grid-template-columns:1fr; }
      .identity { text-align:left; }
      .journey { grid-template-columns:1fr; }
      .journey button { min-height:0; }
      .layout { grid-template-columns:1fr; }
      .side { position:static; grid-row:1; }
      .triple, .check-grid { grid-template-columns:1fr; }
      textarea, input[type=text], input[type=date], select { font-size:16px; }
    }
  </style>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/brand/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/brand/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta property="og:image" content="https://vinaypasricha.com/assets/images/brand/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:image" content="https://vinaypasricha.com/assets/images/brand/og-image.png">
</head>
<body>
  <main class="course-shell" id="app">
    <p style="font-family:var(--mono);color:var(--ink-3)">Loading your course workspace…</p>
  </main>
  <script>
    (function () {
      var path = location.pathname.replace(/\/+$/, '');
      if (path === '/ai-business-leaders/course' || path === '/ai-business-leaders/course.html') {
        location.replace('/ai-business-leaders/login');
      }
    })();
  </script>
  <script src="/ai-business-leaders/course.js"></script>
</body>
</html>
