<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI for Business Leaders — Preparation Session</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css">
  <style>
    .abl { max-width: 720px; margin: 0 auto; padding: 40px 24px 96px; }
    .abl-head { border-bottom: 1px solid var(--rule); padding-bottom: 16px; }
    .abl-kicker { font-family: var(--mono); font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); }
    .abl-title { font-family: var(--serif); font-size: 28px; letter-spacing: -.01em; margin-top: 4px; }
    .abl-steps { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 18px 0 0; font-family: var(--mono); font-size: 11px; }
    .abl-steps .step { color: var(--ink-4); }
    .abl-steps .step.on { color: var(--accent); }

    .abl-copy { font-family: var(--serif); font-size: 16px; line-height: 1.65; color: var(--ink-2); white-space: pre-line; margin-top: 24px; }
    .abl-privacy { margin-top: 22px; border: 1px solid var(--rule); background: var(--paper-3); border-radius: 4px; padding: 16px 18px; font-size: 14px; line-height: 1.6; color: var(--ink-3); }
    .abl-privacy .lbl { font-family: var(--mono); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
    .abl-consent { display: flex; gap: 9px; align-items: flex-start; margin-top: 12px; color: var(--ink); cursor: pointer; }
    .abl-consent input { margin-top: 4px; accent-color: var(--accent); }

    .abl-h2 { font-family: var(--serif); font-size: 20px; margin: 32px 0 14px; }
    .depths { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
    .depth { text-align: left; background: var(--paper-3); border: 1px solid var(--rule); border-radius: 6px; padding: 16px; cursor: pointer; transition: border-color .15s, box-shadow .15s; font: inherit; color: inherit; }
    .depth:hover:not(:disabled) { border-color: var(--accent); box-shadow: 0 1px 0 var(--rule); }
    .depth:disabled { opacity: .5; cursor: not-allowed; }
    .depth .m { font-family: var(--mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
    .depth .t { font-family: var(--serif); font-size: 18px; margin-top: 4px; }
    .depth .b { font-size: 13.5px; color: var(--ink-3); line-height: 1.5; margin-top: 8px; }
    .depth .r { font-family: var(--mono); font-size: 11px; color: var(--ink-2); margin-top: 12px; }

    .msgs { display: flex; flex-direction: column; gap: 12px; margin-top: 22px; }
    .row { display: flex; }
    .row.me { justify-content: flex-end; }
    .row.them { justify-content: flex-start; }
    .bubble { max-width: 86%; border-radius: 10px; padding: 12px 15px; font-size: 15px; line-height: 1.6; }
    .row.me .bubble { background: var(--ink); color: var(--paper); white-space: pre-line; }
    .row.them .bubble { background: var(--paper-3); border: 1px solid var(--rule); color: var(--ink); }
    .bubble :is(h1,h2,h3){ font-family: var(--serif); margin: 6px 0 2px; }
    .bubble p { margin: 6px 0; } .bubble ul { margin: 6px 0 6px 18px; }
    .thinking { font-family: var(--mono); font-size: 13px; color: var(--ink-3); }

    .composer { margin-top: 18px; position: sticky; bottom: 0; background: color-mix(in srgb, var(--paper) 94%, transparent); padding-top: 12px; }
    .composer textarea { width: 100%; border: 1px solid var(--rule); background: var(--paper-3); border-radius: 6px; padding: 12px; font: inherit; font-size: 15px; color: var(--ink); resize: vertical; }
    .composer textarea:focus { outline: none; border-color: var(--accent); }
    .composer-row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
    .link-btn { font-family: var(--mono); font-size: 13px; color: var(--accent); background: none; border: none; cursor: pointer; }
    .link-btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn { font-family: var(--mono); font-size: 13px; letter-spacing: .06em; background: var(--ink); color: var(--paper); border: none; border-radius: 5px; padding: 10px 18px; cursor: pointer; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn.accent { background: var(--accent); }
    .count { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-top: 6px; }
    /* Finishing the session is the key end action — give it its own prominent,
       full-width button, clearly separated from (and unmistakable for) Send. */
    .finish-cta { margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--rule); text-align: center; }
    .btn-finish { width: 100%; font-family: var(--mono); font-size: 13px; letter-spacing: .05em; text-transform: uppercase;
      background: var(--accent); color: var(--paper); border: none; border-radius: 9px; padding: 15px 18px; cursor: pointer;
      box-shadow: 0 2px 10px color-mix(in srgb, var(--accent) 28%, transparent); transition: filter .15s, transform .15s, box-shadow .15s; }
    .btn-finish:hover:not(:disabled) { filter: brightness(1.07); transform: translateY(-1px); box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 34%, transparent); }
    .btn-finish:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
    .finish-sub { font-family: var(--serif); font-style: italic; font-size: 12.5px; color: var(--ink-3); margin-top: 9px; line-height: 1.45; }
    .opts { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
    .opt { text-align: left; background: var(--paper-3); border: 1px solid var(--rule); border-radius: 9px; padding: 12px 14px; font: inherit; font-size: 14.5px; line-height: 1.5; color: var(--ink); cursor: pointer; display: flex; gap: 10px; align-items: flex-start; transition: border-color .15s, background .15s; }
    .opt:hover { border-color: var(--accent); background: var(--paper-2); }
    .opt-i { font-family: var(--mono); font-size: 11px; color: var(--accent); border: 1px solid var(--rule); border-radius: 4px; min-width: 21px; height: 21px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
    .opt-or { text-align: center; font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-4); margin: 14px 0 2px; }
    .warn { font-family: var(--mono); font-size: 12px; color: var(--accent); margin-top: 12px; }

    .doc { border: 1px solid var(--rule); background: var(--paper-3); border-radius: 6px; padding: 20px 22px; margin-top: 12px; }
    .doc :is(h1,h2,h3){ font-family: var(--serif); } .doc h1{ font-size: 24px; } .doc h2{ font-size: 18px; border-bottom: 1px solid var(--rule); padding-bottom: 4px; margin-top: 18px; } .doc h3{ font-size: 15px; margin-top: 14px; }
    .doc p { margin: 8px 0; line-height: 1.6; } .doc ul { margin: 8px 0 8px 20px; } .doc li { margin: 3px 0; }
    .mdt { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 14px; }
    .mdt th, .mdt td { border: 1px solid var(--rule); padding: 7px 10px; text-align: left; vertical-align: top; }
    .mdt th { background: var(--paper-2); font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
    .review-ta { width: 100%; min-height: 260px; border: 1px solid var(--rule); background: var(--paper-3); border-radius: 6px; padding: 12px; font-family: var(--mono); font-size: 13px; line-height: 1.6; color: var(--ink); }
    .review-note { width: 100%; border: 1px solid var(--rule); background: var(--paper-3); border-radius: 6px; padding: 11px; font: inherit; margin-top: 12px; }
    .muted { color: var(--ink-3); }
    .explore { margin-top: 42px; border-top: 1px solid var(--rule); padding-top: 28px; }
    .explore-h { font-family: var(--mono); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 18px; }
    .explore-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .ex-card { position: relative; display: flex; flex-direction: column; min-height: 168px; text-decoration: none;
      background: var(--paper-3); border: 1px solid var(--rule); border-radius: 14px; padding: 24px 24px 22px;
      transition: border-color .18s, background .18s, transform .18s, box-shadow .18s; }
    .ex-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,.07); }
    /* Featured (the books) — a soft accent tint so the primary next step reads first */
    .ex-card.feat { background: color-mix(in srgb, var(--accent) 7%, var(--paper-3)); border-color: color-mix(in srgb, var(--accent) 26%, var(--rule)); }
    .ex-card.feat:hover { background: color-mix(in srgb, var(--accent) 11%, var(--paper-3)); }
    .ex-k { font-family: var(--mono); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
    .ex-t { font-family: var(--serif); font-size: 23px; letter-spacing: -.01em; line-height: 1.15; color: var(--ink); }
    .ex-d { font-size: 13.5px; color: var(--ink-3); margin-top: 9px; line-height: 1.5; flex: 1; }
    .ex-cta { font-family: var(--mono); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2);
      margin-top: 18px; display: inline-flex; align-items: center; gap: 8px; }
    .ex-arrow { display: inline-block; transition: transform .18s; }
    .ex-card:hover .ex-cta { color: var(--accent); }
    .ex-card:hover .ex-arrow { transform: translateX(5px); }
    .abl-prog { height: 4px; background: var(--rule-soft); border-radius: 3px; margin-top: 14px; overflow: hidden; }
    .abl-prog-bar { height: 100%; background: var(--accent); border-radius: 3px; transition: width .4s ease; }
    .abl-prog-t { font-family: var(--mono); font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-4); margin-top: 5px; }
    .resumed { background: var(--paper-2); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 14px; margin-top: 16px; font-size: 14px; color: var(--ink-2); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .fb { margin-top: 30px; border-top: 1px solid var(--rule); padding-top: 22px; }
    .fb-h { font-family: var(--serif); font-size: 18px; color: var(--ink); margin-bottom: 10px; }
    .fb-stars { display: flex; gap: 4px; }
    .star { background: none; border: none; font-size: 30px; line-height: 1; color: var(--rule); cursor: pointer; padding: 0 2px; transition: color .1s; }
    .star.on, .star:hover { color: var(--accent-2); }
    .fb-comment { width: 100%; margin-top: 12px; border: 1px solid var(--rule); background: var(--paper-3); border-radius: 6px; padding: 11px; font: inherit; font-size: 14px; color: var(--ink); }
    .fb-comment:focus { outline: none; border-color: var(--accent); }
    .contact { margin-top: 30px; border-top: 1px solid var(--rule); padding-top: 16px; font-family: var(--mono); font-size: 12px; color: var(--ink-3); }
    .contact a { color: var(--accent); }

    /* ---- Phones (≤560px) ---------------------------------------------------
       This session link is shared directly with participants, so it has to
       feel native on a phone: no iOS zoom-on-focus, thumb-sized controls,
       and no long word / wide table can break the layout. */
    @media (max-width: 560px) {
      .abl { padding: 30px 16px 88px; }
      .abl-title { font-size: 24px; }
      /* font-size >=16px is what stops mobile Safari from zooming on focus */
      .composer textarea, .review-ta, .review-note, .fb-comment { font-size: 16px; }
      /* comfortable tap targets (>=44px) */
      .btn { padding: 13px 20px; }
      .link-btn { min-height: 44px; padding: 6px 2px; }
      .composer-row { flex-wrap: wrap; gap: 10px 12px; }
      .composer-row .btn { flex-shrink: 0; }
      .depths, .explore-grid { grid-template-columns: 1fr; }
      /* keep long URLs and wide brief tables from forcing horizontal scroll */
      .bubble, .doc { overflow-wrap: anywhere; }
      .doc { overflow-x: auto; }
      .mdt { font-size: 13px; }
    }
  </style>
</head>
<body>
  <main class="abl" id="app"><p class="muted" style="font-family:var(--mono)">Loading your session…</p></main>
  <script src="/ai-business-leaders/session.js"></script>
</body>
</html>
