<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Focused AI Leadership Workspace Preview</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/brand/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/brand/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta property="og:image" content="https://vinaypasricha.com/assets/images/brand/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:image" content="https://vinaypasricha.com/assets/images/brand/og-image.png">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f0e6}
    iframe{display:block;width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <iframe id="workspace" src="./workspace-preview.html" title="Focused AI Leadership Workspace preview"></iframe>
  <script>
    document.getElementById('workspace').addEventListener('load', function () {
      try {
        var doc = this.contentDocument;
        if (!doc || doc.getElementById('focusedHomeLayer')) return;

        var focus = doc.createElement('script');
        focus.id = 'focusedHomeLayer';
        focus.src = './workspace-home-focus.js';
        focus.onload = function () {
          var participantOnly = doc.createElement('script');
          participantOnly.id = 'participantOnlyLayer';
          participantOnly.src = './participant-only-nav.js';
          doc.body.appendChild(participantOnly);
        };
        doc.body.appendChild(focus);
      } catch (e) {
        document.body.innerHTML = '<p style="font-family:Arial;padding:24px">The preview could not be opened.</p>';
      }
    });
  </script>
</body>
</html>
